      </g>
      <!-- Row 5 -->
      <text x="0" y="57" class="font-mono" font-size="9" fill="#94a3b8">PR-5</text>
      <g transform="translate(34, 48)">
        <rect x="0" y="0" width="18" height="9" rx="2" fill="#f59e0b" />
        <rect x="22" y="0" width="18" height="9" rx="2" fill="#ef4444" fill-opacity="0.65" />
        <rect x="44" y="0" width="18" height="9" rx="2" fill="#ef4444" fill-opacity="0.65" />
        <rect x="66" y="0" width="18" height="9" rx="2" fill="#ef4444" fill-opacity="0.65" />
        <rect x="88" y="0" width="18" height="9" rx="2" fill="#ef4444" fill-opacity="0.65" />
        <rect x="110" y="0" width="18" height="9" rx="2" fill="#ef4444" fill-opacity="0.65" />
        <rect x="132" y="0" width="18" height="9" rx="2" fill="#ef4444" fill-opacity="0.65" />
        <rect x="154" y="0" width="18" height="9" rx="2" fill="#ef4444" fill-opacity="0.65" />
        <rect x="176" y="0" width="18" height="9" rx="2" fill="#ef4444" fill-opacity="0.65" />
        <rect x="198" y="0" width="18" height="9" rx="2" fill="#ef4444" fill-opacity="0.65" />
        <rect x="220" y="0" width="18" height="9" rx="2" fill="#ef4444" fill-opacity="0.65" />
        <rect x="242" y="0" width="18" height="9" rx="2" fill="#ef4444" fill-opacity="0.65" />
        <rect x="274" y="0" width="110" height="9" rx="2" fill="#b91c1c" />
      </g>
    </g>

    <!-- 4 Key Metric Rows -->
    <g transform="translate(18, 180)">
      <rect x="0" y="0" width="448" height="34" rx="6" fill="#1e293b" stroke="#7f1d1d" stroke-width="1" />
      <text x="14" y="22" class="font-mono metric-val" fill="#fca5a5">✕ 60 Duplicate Pods</text>
      <text x="210" y="22" class="font-sans metric-desc">12 services × 5 open PRs</text>

      <rect x="0" y="40" width="448" height="34" rx="6" fill="#1e293b" stroke="#7f1d1d" stroke-width="1" />
      <text x="14" y="62" class="font-mono metric-val" fill="#fcd34d">✕ 5 Full DB Instances</text>
      <text x="210" y="62" class="font-sans metric-desc">5 separate Postgres StatefulSets</text>

      <rect x="0" y="80" width="448" height="34" rx="6" fill="#1e293b" stroke="#7f1d1d" stroke-width="1" />
      <text x="14" y="102" class="font-mono metric-val" fill="#fca5a5">✕ ~12 min cold boot</text>
      <text x="210" y="102" class="font-sans metric-desc">Full Helm/Argo stack sync per PR</text>

      <rect x="0" y="120" width="448" height="36" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.2" />
      <text x="14" y="143" class="font-mono metric-val" fill="#fecaca">✕ ~$2,400/mo cloud spend</text>
      <text x="235" y="143" class="font-sans metric-desc" fill="#fca5a5">Always-on duplicate cluster nodes</text>
    </g>
