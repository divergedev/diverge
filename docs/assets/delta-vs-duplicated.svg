<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" width="100%" height="100%" role="img" aria-labelledby="delta-title delta-desc">
  <title id="delta-title">Traditional Full-Stack Duplication vs. Diverge Delta Preview</title>
  <desc id="delta-desc">Side-by-side comparison showing Traditional Full-Stack Duplication (12 services x 5 open PRs = 60 Duplicate Pods, 5 Full DB Instances, ~12 min cold boot, ~$2,400/mo cloud spend) versus Diverge Delta Preview PreviewGroup (12 baseline pods + 5 changed PR pods = 17 Pods Total 72% reduction, 1 Shared Postgres with 5 instant schemas, under 15s deploy, ~$340/mo cloud spend).</desc>
  <defs>
    <style>
      .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .panel-badge { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .panel-title { font-size: 17px; font-weight: 800; fill: #f8fafc; }
      .metric-val { font-size: 13.5px; font-weight: 700; }
      .metric-desc { font-size: 11.5px; font-weight: 500; fill: #94a3b8; }
      .viz-label { font-size: 10px; font-weight: 600; }
    </style>

    <pattern id="cmp-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.65" />
    </pattern>

    <linearGradient id="left-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="right-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#1e1b4b" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="1040" height="440" rx="16" fill="#0f172a" />
  <rect x="0" y="0" width="1040" height="440" rx="16" fill="url(#cmp-grid)" />
  <rect x="1" y="1" width="1038" height="438" rx="15" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Top Header Bar -->
  <rect x="24" y="16" width="992" height="40" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
  <text x="42" y="41" class="font-sans" font-size="14" font-weight="700" fill="#f8fafc">Architecture &amp; Cloud Cost Comparison — 12 Microservices × 5 Open Pull Requests</text>
  <rect x="824" y="24" width="178" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <text x="913" y="40" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#a7f3d0">72% Fewer Pods • 86% Saved</text>

  <!-- ======================================================================= -->
  <!-- LEFT PANEL: TRADITIONAL FULL-STACK DUPLICATION (RED / AMBER ACCENT)     -->
  <!-- ======================================================================= -->
  <g transform="translate(24, 68)">
    <rect x="0" y="0" width="484" height="352" rx="12" fill="url(#left-grad)" stroke="#ef4444" stroke-width="1.5" />

    <!-- Badge & Title -->
    <rect x="18" y="16" width="246" height="22" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1" />
    <text x="141" y="31" text-anchor="middle" class="font-sans panel-badge" fill="#fecaca">Traditional Full-Stack Duplication</text>
    <text x="18" y="60" class="font-sans panel-title">12 Services × 5 Open PRs Cloned in Full</text>

    <!-- Visual Cluster Diagram (60 Pods + 5 DBs) -->
    <rect x="18" y="72" width="448" height="96" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#7f1d1d" stroke-width="1" />
    <text x="30" y="90" class="font-mono viz-label" fill="#fca5a5">5 Cloned PR Namespaces (11 unchanged services duplicated per PR)</text>

    <!-- 5 PR Rows x 12 Pods + DB icon -->
    <g transform="translate(30, 98)">
      <!-- Row 1 -->
      <text x="0" y="9" class="font-mono" font-size="9" fill="#94a3b8">PR-1</text>
      <g transform="translate(34, 0)">
