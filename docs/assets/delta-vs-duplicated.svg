  <!-- ======================================================================= -->
  <!-- RIGHT PANEL: DIVERGE DELTA PREVIEW (EMERALD / INDIGO ACCENT)            -->
  <!-- ======================================================================= -->
  <g transform="translate(532, 68)">
    <rect x="0" y="0" width="484" height="352" rx="12" fill="url(#right-grad)" stroke="#10b981" stroke-width="1.8" />

    <!-- Badge & Title -->
    <rect x="18" y="16" width="276" height="22" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="156" y="31" text-anchor="middle" class="font-sans panel-badge" fill="#a7f3d0">Diverge Delta Preview (PreviewGroup)</text>
    <text x="18" y="60" class="font-sans panel-title">12 Baseline Pods + 5 Changed PR Pods</text>

    <!-- Visual Cluster Diagram (12 Baseline + 5 Delta + 1 Shared DB with 5 Schemas) -->
    <rect x="18" y="72" width="448" height="96" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#059669" stroke-width="1" />
    <text x="30" y="90" class="font-mono viz-label" fill="#6ee7b7">Shared Baseline (Indigo) + Isolated Delta PR Pods (Emerald)</text>

    <g transform="translate(30, 100)">
      <text x="0" y="11" class="font-mono" font-size="9" fill="#a5b4fc">Base (12)</text>
      <g transform="translate(56, 2)">
        <rect x="0" y="0" width="16" height="11" rx="2" fill="#6366f1" />
        <rect x="20" y="0" width="16" height="11" rx="2" fill="#6366f1" />
        <rect x="40" y="0" width="16" height="11" rx="2" fill="#6366f1" />
        <rect x="60" y="0" width="16" height="11" rx="2" fill="#6366f1" />
        <rect x="80" y="0" width="16" height="11" rx="2" fill="#6366f1" />
        <rect x="100" y="0" width="16" height="11" rx="2" fill="#6366f1" />
        <rect x="120" y="0" width="16" height="11" rx="2" fill="#6366f1" />
        <rect x="140" y="0" width="16" height="11" rx="2" fill="#6366f1" />
        <rect x="160" y="0" width="16" height="11" rx="2" fill="#6366f1" />
        <rect x="180" y="0" width="16" height="11" rx="2" fill="#6366f1" />
        <rect x="200" y="0" width="16" height="11" rx="2" fill="#6366f1" />
        <rect x="220" y="0" width="16" height="11" rx="2" fill="#6366f1" />
      </g>

      <text x="0" y="34" class="font-mono" font-size="9" fill="#6ee7b7">Delta (5)</text>
      <g transform="translate(56, 24)">
        <rect x="0" y="0" width="38" height="13" rx="3" fill="#10b981" />
        <text x="19" y="10" text-anchor="middle" class="font-mono" font-size="8" font-weight="700" fill="#052e16">pr-41</text>
        <rect x="44" y="0" width="38" height="13" rx="3" fill="#10b981" />
        <text x="63" y="10" text-anchor="middle" class="font-mono" font-size="8" font-weight="700" fill="#052e16">pr-42</text>
        <rect x="88" y="0" width="38" height="13" rx="3" fill="#10b981" />
        <text x="107" y="10" text-anchor="middle" class="font-mono" font-size="8" font-weight="700" fill="#052e16">pr-43</text>
        <rect x="132" y="0" width="38" height="13" rx="3" fill="#10b981" />
        <text x="151" y="10" text-anchor="middle" class="font-mono" font-size="8" font-weight="700" fill="#052e16">pr-44</text>
        <rect x="176" y="0" width="38" height="13" rx="3" fill="#10b981" />
        <text x="195" y="10" text-anchor="middle" class="font-mono" font-size="8" font-weight="700" fill="#052e16">pr-45</text>
