      <text x="0" y="55" class="font-mono" font-size="9" fill="#7dd3fc">Postgres</text>
      <rect x="56" y="45" width="358" height="14" rx="3" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8" />
      <text x="235" y="55" text-anchor="middle" class="font-mono" font-size="8.5" fill="#c7d2fe">1 Shared DB → 5 Instant Schemas (preview_pr_41..45)</text>
    </g>

    <!-- 4 Key Metric Rows -->
