        <rect x="274" y="0" width="110" height="9" rx="2" fill="#b91c1c" />
      </g>
      <!-- Row 3 -->
      <text x="0" y="33" class="font-mono" font-size="9" fill="#94a3b8">PR-3</text>
      <g transform="translate(34, 24)">
        <rect x="0" y="0" width="18" height="9" rx="2" fill="#f59e0b" />
        <rect x="22" y="0" width="18" height="9" rx="2" fill="#ef4444" fill-opacity="0.65" />
        <rect x="44" y="0" width="18" height="9" rx="2" fill="#ef4444" fill-opacity="0.65" />
        <rect x="66" y="0" width="18" height="9" rx="2" fill="#ef4444" fill-opacity="0.65" />
        <rect x="88" y="0" width="18" height="9" rx="2" fill="#ef4444" fill-opacity="0.65" />
        <rect x="110" y="0" width="18" height="9" rx="2" fill="#ef4444" fill-opacity="0.65" />
        <rect x="132" y="0" width="18" height="9" rx="2" fill="#ef4444" fill-opacity="0.65" />
        <rect x="154" y="0" width="18" height="9" rx="2" fill="#ef4444" fill-opacity="0.65" />
        <rect x="176" y="0" width="18" height="9" rx="2" fill="#ef4444" fill-opacity="0.65" />
        <rect x="198" y="0" width="18" height="9" rx="2" fill="#ef4444" fill-opacity="0.65" />
        <rect x="220" y="0" width="18" height="9" rx="2" fill="#ef4444" fill-opacity="0.65" />
