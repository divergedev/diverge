      <rect x="0" y="0" width="448" height="34" rx="6" fill="#1e293b" stroke="#059669" stroke-width="1" />
      <text x="14" y="22" class="font-mono metric-val" fill="#6ee7b7">✓ 17 Pods Total (72% reduction)</text>
      <text x="275" y="22" class="font-sans metric-desc">12 baseline + 5 PR pods</text>

      <rect x="0" y="40" width="448" height="34" rx="6" fill="#1e293b" stroke="#059669" stroke-width="1" />
