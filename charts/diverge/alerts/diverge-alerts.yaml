groups:
  - name: diverge.rules
    rules:
      - alert: DivergeControllerDown
        expr: absent(diverge_environments_active)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Diverge controller is down"
          description: "The Diverge controller has been unavailable for more than 5 minutes."
      - alert: DivergeEnvironmentStuck
        expr: diverge_environment_ttl_remaining_seconds < 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Environment {{ $labels.environment }} in {{ $labels.namespace }} has expired TTL"
      - alert: DivergeReconcileErrors
        expr: rate(diverge_reconcile_total{result="error"}[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High reconcile error rate"
      - alert: DivergeAsyncProvisionSlow
        expr: histogram_quantile(0.95, sum by (le, protocol) (rate(diverge_async_provision_duration_seconds_bucket[5m]))) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Async provisioning p95 > 30s"
      - alert: DivergeHighEnvironmentHourlyCost
        expr: sum(diverge_environment_estimated_hourly_cost_usd) > 5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Total preview environment hourly cost exceeds $5/hr"
