---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: agenttasks.divergedev.com
spec:
  group: divergedev.com
  names:
    kind: AgentTask
    listKind: AgentTaskList
    plural: agenttasks
    singular: agenttask
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Agent task lifecycle phase
      jsonPath: .status.phase
      name: Phase
      type: string
    - description: Sandbox pod name
      jsonPath: .status.sandboxPodName
      name: Sandbox
      type: string
    - description: Draft PR URL
      jsonPath: .status.prURL
      name: PR
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentTask represents an autonomous AI development task in Diverge.
          It orchestrates an isolated sandbox, code execution, automated testing against preview
          environments, and draft PR generation.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentTaskSpec defines the desired execution state of an AgentTask.
            properties:
              budgetTokens:
                description: BudgetTokens specifies the maximum token consumption
                  limit (e.g. 500000).
                format: int64
                type: integer
              budgetUSD:
                description: BudgetUSD specifies the maximum token and compute spend
                  limit (e.g. "5.00").
                type: string
              capabilities:
                description: Capabilities defines allowed model tiers (e.g. ["fast",
                  "lite", "smart"]).
                items:
                  type: string
                type: array
              draftPR:
                default: true
                description: |-
                  DraftPR specifies whether PRs created by the agent must be in Draft mode.
                  Defaults to true for safety.
                type: boolean
              maxIterations:
                default: 5
                description: |-
                  MaxIterations sets the maximum number of autonomous build-test-review loops.
                  Defaults to 5.
                format: int32
                type: integer
              objective:
                description: Objective is the human-provided natural language task
                  or specification.
                minLength: 1
                type: string
              repository:
                description: Repository specifies the target VCS repository.
                properties:
                  baseBranch:
                    default: main
                    description: BaseBranch is the baseline branch to fork from and
                      submit PR against (defaults to "main").
                    type: string
                  url:
                    description: URL is the Git clone URL (e.g. https://github.com/org/repo
                      or git@github.com:org/repo.git).
                    type: string
                  workingBranch:
                    description: |-
                      WorkingBranch is the branch where the agent commits its work.
                      Defaults to "agent/<task-name>".
                    type: string
                required:
                - url
                type: object
              sandbox:
                description: Sandbox configures the isolated sandbox execution runtime.
                properties:
                  poolRef:
                    description: PoolRef references a pre-warmed SandboxWarmPool in
                      the cluster.
                    type: string
                  provider:
                    default: agent-sandbox
                    description: Provider defines the sandbox provider kind. Defaults
                      to "agent-sandbox".
                    type: string
                  templateRef:
                    description: TemplateRef references a SandboxTemplate definition.
                    type: string
                  timeoutSeconds:
                    default: 3600
                    description: TimeoutSeconds is the execution TTL for the sandbox.
                      Defaults to 3600 (1 hour).
                    format: int32
                    type: integer
                type: object
              suspended:
                description: Suspended pauses the agent execution and scales compute
                  to zero.
                type: boolean
            required:
            - objective
            - repository
            type: object
          status:
            description: AgentTaskStatus defines the observed state of an AgentTask.
            properties:
              conditions:
                description: Conditions describe state transitions and status observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              costUSD:
                description: CostUSD is the accumulated token/compute cost in USD.
                type: string
              iteration:
                description: Iteration tracks the current autonomous loop cycle.
                format: int32
                type: integer
              message:
                description: Message is human-readable status or diagnostic text.
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent metadata generation
                  observed by the controller.
                format: int64
                type: integer
              phase:
                default: Pending
                description: Phase is the current lifecycle state.
                type: string
              prURL:
                description: PRURL is the URL of the created draft pull request once
                  opened.
                type: string
              sandboxClaimRef:
                description: SandboxClaimRef is the name of the SandboxClaim created
                  for this task.
                type: string
              sandboxIP:
                description: SandboxIP is the IP address of the sandbox pod.
                type: string
              sandboxPodName:
                description: SandboxPodName is the pod executing the sandbox workspace.
                type: string
              tokensConsumed:
                description: TokensConsumed is the accumulated count of prompt and
                  candidate tokens consumed.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
