{{- if .Values.rbac.namespaceScoped }}
{{- $fullname := include "diverge.fullname" . }}
{{- range .Values.rbac.managedNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-controller-role
  namespace: {{ . }}
rules:
  # Diverge CRDs
  - apiGroups: ["divergedev.com"]
    resources: [environments, environments/status, environments/finalizers,
                previewgroups, previewgroups/status, previewgroups/finalizers,
                agenttasks, agenttasks/status, agenttasks/finalizers]
    verbs: [get, list, watch, create, update, patch, delete]


  # Core K8s - Workloads
  - apiGroups: [""]
    resources: [pods, services, secrets, configmaps, serviceaccounts, limitranges, resourcequotas]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  # Batch - Migration jobs
  - apiGroups: ["batch"]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  # Istio - AuthorizationPolicy written by the istio routing provider
  - apiGroups: ["security.istio.io"]
    resources: [authorizationpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  # Gateway API
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: [httproutes, grpcroutes]
    verbs: [get, list, watch, create, update, patch, delete]
  # NetworkPolicies
  - apiGroups: ["networking.k8s.io"]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  # EndpointSlices (PreviewGroup cleanup)
  - apiGroups: ["discovery.k8s.io"]
    resources: [endpointslices]
    verbs: [get, list, watch, create, update, patch, delete]
  # Events (legacy + new events.k8s.io API)
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: ["events.k8s.io"]
    resources: [events]
    verbs: [create, patch, update]
  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  # Argo CD
  - apiGroups: ["argoproj.io"]
    resources: [applicationsets, applications]
    verbs: [get, list, watch, create, update, patch, delete]
  # KEDA HTTP Add-on
  - apiGroups: ["http.keda.sh"]
    resources: [httpscaledobjects]
    verbs: [get, list, watch, create, update, patch, delete]
  # Atlas DB migrations
  - apiGroups: ["db.atlasgo.io"]
    resources: [atlasmigrations, atlasschemas]
    verbs: [get, list, watch, create, update, patch, delete]
  # Agent Sandbox CRDs
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: [sandboxclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["agents.x-k8s.io"]
    resources: [sandboxes]
    verbs: [get, list, watch]
  # Knative Serving
  - apiGroups: ["serving.knative.dev"]
    resources: [services]
    verbs: [get, list, watch, create, update, patch, delete]
{{- end }}
{{- end }}
