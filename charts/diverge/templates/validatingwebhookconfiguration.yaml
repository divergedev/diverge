{{- if and .Values.webhook.validatingWebhook.enabled (not .Values.rbac.namespaceScoped) }}
{{- if and (not .Values.certManager.enabled) (not .Values.webhook.validatingWebhook.caBundle) }}
{{- fail "webhook.validatingWebhook.caBundle is required when webhook.validatingWebhook.enabled=true and certManager.enabled=false" }}
{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "diverge.fullname" . }}-validating-webhook-configuration
  labels:
    {{- include "diverge.labels" . | nindent 4 }}
  {{- if .Values.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "diverge.fullname" . }}-webhook
  {{- end }}
webhooks:
  - name: venvironment.divergedev.com
    admissionReviewVersions:
      - v1
    clientConfig:
      {{- if .Values.webhook.validatingWebhook.caBundle }}
      caBundle: {{ .Values.webhook.validatingWebhook.caBundle | quote }}
      {{- end }}
      service:
        name: {{ include "diverge.fullname" . }}-webhook-service
        namespace: {{ .Release.Namespace }}
        path: /validate-divergedev-com-v1alpha1-environment
    failurePolicy: {{ .Values.webhook.validatingWebhook.failurePolicy | default "Fail" }}
    sideEffects: None
    rules:
      - apiGroups:
          - divergedev.com
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - environments
  - name: vpreviewgroup.divergedev.com
    admissionReviewVersions:
      - v1
    clientConfig:
      {{- if .Values.webhook.validatingWebhook.caBundle }}
      caBundle: {{ .Values.webhook.validatingWebhook.caBundle | quote }}
      {{- end }}
      service:
        name: {{ include "diverge.fullname" . }}-webhook-service
        namespace: {{ .Release.Namespace }}
        path: /validate-divergedev-com-v1alpha1-previewgroup
    failurePolicy: {{ .Values.webhook.validatingWebhook.failurePolicy | default "Fail" }}
    sideEffects: None
    rules:
      - apiGroups:
          - divergedev.com
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - previewgroups
  - name: vagenttask.divergedev.com
    admissionReviewVersions:
      - v1
    clientConfig:
      {{- if .Values.webhook.validatingWebhook.caBundle }}
      caBundle: {{ .Values.webhook.validatingWebhook.caBundle | quote }}
      {{- end }}
      service:
        name: {{ include "diverge.fullname" . }}-webhook-service
        namespace: {{ .Release.Namespace }}
        path: /validate-divergedev-com-v1alpha1-agenttask
    failurePolicy: {{ .Values.webhook.validatingWebhook.failurePolicy | default "Fail" }}
    sideEffects: None
    rules:
      - apiGroups:
          - divergedev.com
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - agenttasks
{{- end }}
