{{- if .Values.grafana.dashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "diverge.fullname" . }}-grafana-dashboard
  labels:
    grafana_dashboard: "1"
    {{- include "diverge.labels" . | nindent 4 }}
data:
  diverge-overview.json: |-
    {{- .Files.Get "dashboards/diverge-overview.json" | nindent 4 }}
{{- end }}
