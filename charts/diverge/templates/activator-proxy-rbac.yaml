{{- if .Values.activatorProxy.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "diverge.fullname" . }}-activator-proxy
  labels:
    {{- include "diverge.labels" . | nindent 4 }}
    app.kubernetes.io/component: activator-proxy
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "diverge.fullname" . }}-activator-proxy
  labels:
    {{- include "diverge.labels" . | nindent 4 }}
    app.kubernetes.io/component: activator-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "diverge.fullname" . }}-activator-proxy
subjects:
  - kind: ServiceAccount
    name: {{ include "diverge.fullname" . }}-activator-proxy
    namespace: {{ .Release.Namespace }}
{{- end }}
