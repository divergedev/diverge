{{- if .Values.server.enabled }}
# CRD ClusterRole (always cluster-scoped)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "diverge.fullname" . }}-server-crd
  labels:
    {{- include "diverge.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
rules:
  - apiGroups: ["diverge.io"]
    resources: ["environments", "previewgroups"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "diverge.fullname" . }}-server-crd
  labels:
    {{- include "diverge.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "diverge.fullname" . }}-server-crd
subjects:
  - kind: ServiceAccount
    name: {{ include "diverge.fullname" . }}-server
    namespace: {{ .Release.Namespace }}
---
# Auth ClusterRole (always cluster-scoped)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "diverge.fullname" . }}-server-auth
  labels:
    {{- include "diverge.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "diverge.fullname" . }}-server-auth
  labels:
    {{- include "diverge.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "diverge.fullname" . }}-server-auth
subjects:
  - kind: ServiceAccount
    name: {{ include "diverge.fullname" . }}-server
    namespace: {{ .Release.Namespace }}
---
# Pod logs for StreamLogs
# When targetNamespaces is not set, fallback to cluster-wide role
{{- if .Values.server.rbac.clusterWidePodAccess }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "diverge.fullname" . }}-server-pods
  labels:
    {{- include "diverge.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "diverge.fullname" . }}-server-pods
  labels:
    {{- include "diverge.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "diverge.fullname" . }}-server-pods
subjects:
  - kind: ServiceAccount
    name: {{ include "diverge.fullname" . }}-server
    namespace: {{ .Release.Namespace }}
{{- else if .Values.server.rbac.targetNamespaces }}
# Limit pods/log access to configured target namespaces to reduce blast radius
# NOTE: Target namespaces must exist before helm install/upgrade.
# The chart does NOT create these namespaces.
{{- range $index, $namespace := .Values.server.rbac.targetNamespaces }}
{{- if $index }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "diverge.fullname" $ }}-server-pods
  namespace: {{ $namespace }}
  labels:
    {{- include "diverge.labels" $ | nindent 4 }}
    app.kubernetes.io/component: server
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "diverge.fullname" $ }}-server-pods
  namespace: {{ $namespace }}
  labels:
    {{- include "diverge.labels" $ | nindent 4 }}
    app.kubernetes.io/component: server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "diverge.fullname" $ }}-server-pods
subjects:
  - kind: ServiceAccount
    name: {{ include "diverge.fullname" $ }}-server
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
