{{- if .Values.server.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "diverge.fullname" . }}-server
  labels:
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "diverge.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
{{- end }}
