apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "diverge.fullname" . }}-controller-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "diverge.fullname" . }}-controller-role
subjects:
- kind: ServiceAccount
  name: {{ .Values.serviceAccount.name | default (include "diverge.fullname" .) }}
  namespace: {{ .Release.Namespace }}
