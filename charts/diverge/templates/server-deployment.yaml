{{- if .Values.server.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "diverge.fullname" . }}-server
  labels:
    {{- include "diverge.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "diverge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "diverge.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: {{ include "diverge.fullname" . }}-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: "{{ .Values.server.image.repository | default .Values.image.repository }}:{{ .Values.server.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          command: ["/diverge-server"]
          args:
            - --addr=:{{ .Values.server.service.port }}
            - --metrics-addr=:9090
            - --token-cache-ttl={{ .Values.server.auth.tokenCacheTTL }}
            - --max-streams={{ .Values.server.auth.maxStreams }}
            - --max-streams-per-user={{ .Values.server.auth.maxStreamsPerUser }}
            - "--cors-allowed-origins={{ .Values.server.cors.allowedOrigins }}"
            - --cors-max-age={{ .Values.server.cors.maxAge }}
            {{- if .Values.server.auth.oidc.enabled }}
            - --oidc-issuer-url={{ .Values.server.auth.oidc.issuerUrl }}
            - --oidc-client-id={{ .Values.server.auth.oidc.clientId }}
            - --oidc-redirect-url={{ .Values.server.auth.oidc.redirectUrl }}
            - "--oidc-provider-name={{ .Values.server.auth.oidc.providerName }}"
            - --oidc-scopes={{ .Values.server.auth.oidc.scopes }}
            - --oidc-username-claim={{ .Values.server.auth.oidc.usernameClaim }}
            - --oidc-groups-claim={{ .Values.server.auth.oidc.groupsClaim }}
            {{- if .Values.server.auth.oidc.allowedGroups }}
            - "--oidc-allowed-groups={{ .Values.server.auth.oidc.allowedGroups }}"
            {{- end }}
            - --session-max-age={{ .Values.server.auth.session.maxAge }}s
            {{- end }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if and .Values.server.auth.oidc.enabled .Values.server.auth.oidc.clientSecretSecretRef.name }}
            - name: DIVERGE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.auth.oidc.clientSecretSecretRef.name }}
                  key: {{ .Values.server.auth.oidc.clientSecretSecretRef.key }}
            {{- end }}
            {{- if and .Values.server.auth.oidc.enabled .Values.server.auth.session.secretRef.name }}
            - name: DIVERGE_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.auth.session.secretRef.name }}
                  key: {{ .Values.server.auth.session.secretRef.key }}
            {{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.server.service.port }}
              protocol: TCP
            - name: http-tunnel
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
{{- end }}
