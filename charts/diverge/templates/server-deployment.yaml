{{- if .Values.server.enabled }}
{{- if and .Values.server.tunnelProxy .Values.server.tunnelProxy.service .Values.server.tunnelProxy.service.enabled (gt (int .Values.server.replicaCount) 1) }}
{{- fail "server.tunnelProxy.service.enabled requires server.replicaCount <= 1 in v0.30.0" }}
{{- end }}
{{- if and (gt (int .Values.server.replicaCount) 1) .Values.server.auth.oidc.enabled (not (and .Values.server.auth.session .Values.server.auth.session.secretRef .Values.server.auth.session.secretRef.name)) }}
{{- fail "server.auth.oidc.enabled with server.replicaCount > 1 requires server.auth.session.secretRef.name" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "diverge.fullname" . }}-server
  labels:
    {{- include "diverge.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "diverge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "diverge.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: {{ include "diverge.fullname" . }}-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: {{ include "diverge.server.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          command: ["/diverge-server"]
          args:
            - --addr=:{{ .Values.server.service.port }}
            - --metrics-addr=:9090
            - --token-cache-ttl={{ .Values.server.auth.tokenCacheTTL }}
            {{- if .Values.server.auth.audiences }}
            - --audiences={{ join "," .Values.server.auth.audiences }}
            {{- end }}
            - --max-streams={{ .Values.server.auth.maxStreams }}
            - --max-streams-per-user={{ .Values.server.auth.maxStreamsPerUser }}
            - "--cors-allowed-origins={{ .Values.server.cors.allowedOrigins }}"
            - --cors-max-age={{ .Values.server.cors.maxAge }}
            - --dashboard={{ .Values.server.dashboard.enabled }}
            {{- if .Values.server.auth.secureCookies }}
            - --secure-cookies={{ .Values.server.auth.secureCookies }}
            {{- end }}
            {{- if .Values.server.auth.oidc.enabled }}
            - --oidc-issuer-url={{ .Values.server.auth.oidc.issuerUrl }}
            - --oidc-client-id={{ .Values.server.auth.oidc.clientId }}
            {{- if .Values.server.auth.oidc.cliClientId }}
            - {{ printf "--oidc-cli-client-id=%s" .Values.server.auth.oidc.cliClientId | quote }}
            {{- end }}
            - --oidc-redirect-url={{ .Values.server.auth.oidc.redirectUrl }}
            - "--oidc-provider-name={{ .Values.server.auth.oidc.providerName }}"
            - --oidc-scopes={{ .Values.server.auth.oidc.scopes }}
            - --oidc-username-claim={{ .Values.server.auth.oidc.usernameClaim }}
            - --oidc-groups-claim={{ .Values.server.auth.oidc.groupsClaim }}
            {{- if .Values.server.auth.oidc.allowedGroups }}
            - "--oidc-allowed-groups={{ .Values.server.auth.oidc.allowedGroups }}"
            {{- end }}
            {{- if .Values.server.auth.oidc.usernamePrefix }}
            - {{ printf "--oidc-username-prefix=%s" .Values.server.auth.oidc.usernamePrefix | quote }}
            {{- end }}
            {{- if .Values.server.auth.oidc.groupsPrefix }}
            - {{ printf "--oidc-groups-prefix=%s" .Values.server.auth.oidc.groupsPrefix | quote }}
            {{- end }}
            {{- if and .Values.server.auth.session .Values.server.auth.session.maxAge }}
            - --session-max-age={{ .Values.server.auth.session.maxAge }}s
            {{- end }}
            {{- end }}
            {{- if and (not .Values.server.rbac.clusterWidePodAccess) .Values.server.rbac.targetNamespaces }}
            - --tunnel-namespaces={{ join "," .Values.server.rbac.targetNamespaces }}
            {{- end }}
            {{- with .Values.server.tunnelProxy }}
            {{- if .defaultNamespace }}
            - --default-tunnel-namespace={{ .defaultNamespace }}
            {{- end }}
            {{- if not (kindIs "invalid" .createPerTunnelServices) }}
            - --tunnel-create-services={{ .createPerTunnelServices }}
            {{- end }}
            {{- if .sharedPreviewOwners }}
            - --shared-preview-owners={{ join "," .sharedPreviewOwners }}
            {{- end }}
            {{- if .proxyServiceAddr }}
            - --tunnel-proxy-service-addr={{ .proxyServiceAddr }}
            {{- else if and .service .service.enabled }}
            - --tunnel-proxy-service-addr={{ include "diverge.fullname" $ }}-tunnel-proxy.{{ $.Release.Namespace }}.svc.cluster.local:{{ .service.port | default 8081 }}
            {{- end }}
            {{- end }}
          env:
            {{- if .Values.observability.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otel.endpoint | quote }}
            {{- if .Values.observability.otel.serviceName }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.observability.otel.serviceName | quote }}
            {{- end }}
            {{- end }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- $goMemLimit := .Values.server.goMemLimit | default "" }}
            {{- if not $goMemLimit }}
              {{- $memLimit := "" }}
              {{- if and .Values.server.resources .Values.server.resources.limits .Values.server.resources.limits.memory }}
                {{- $memLimit = toString .Values.server.resources.limits.memory }}
              {{- end }}
              {{- if hasSuffix "Mi" $memLimit }}
                {{- $raw := trimSuffix "Mi" $memLimit }}
                {{- if regexMatch "^[0-9]+(\\.[0-9]+)?$" $raw }}
                  {{- $mib := int64 (mulf (float64 $raw) 0.84) }}
                  {{- if gt $mib 0 }}{{- $goMemLimit = printf "%dMiB" $mib }}{{- end }}
                {{- end }}
              {{- else if hasSuffix "Gi" $memLimit }}
                {{- $raw := trimSuffix "Gi" $memLimit }}
                {{- if regexMatch "^[0-9]+(\\.[0-9]+)?$" $raw }}
                  {{- $mib := int64 (mulf (float64 $raw) 1024.0 0.84) }}
                  {{- if gt $mib 0 }}{{- $goMemLimit = printf "%dMiB" $mib }}{{- end }}
                {{- end }}
              {{- end }}
              {{- if not $goMemLimit }}{{- $goMemLimit = "430MiB" }}{{- end }}
            {{- end }}
            - name: GOMEMLIMIT
              value: {{ $goMemLimit | quote }}
            {{- if and .Values.server.tunnelProxy .Values.server.tunnelProxy.authTokenSecretRef .Values.server.tunnelProxy.authTokenSecretRef.name }}
            - name: DIVERGE_TUNNEL_PROXY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.tunnelProxy.authTokenSecretRef.name }}
                  key: {{ .Values.server.tunnelProxy.authTokenSecretRef.key | default "token" }}
            {{- end }}
            {{- if and .Values.server.auth.oidc.enabled .Values.server.auth.oidc.clientSecretSecretRef .Values.server.auth.oidc.clientSecretSecretRef.name }}
            - name: DIVERGE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.auth.oidc.clientSecretSecretRef.name }}
                  key: {{ .Values.server.auth.oidc.clientSecretSecretRef.key | default "clientSecret" }}
            {{- end }}
            {{- if and .Values.server.auth.oidc.enabled .Values.server.auth.session .Values.server.auth.session.secretRef .Values.server.auth.session.secretRef.name }}
            - name: DIVERGE_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.auth.session.secretRef.name }}
                  key: {{ .Values.server.auth.session.secretRef.key | default "session-secret" }}
            {{- end }}
            {{- if and .Values.sandbox .Values.sandbox.macaroonSecretRef .Values.sandbox.macaroonSecretRef.name }}
            - name: DIVERGE_MACAROON_ROOT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sandbox.macaroonSecretRef.name }}
                  key: {{ .Values.sandbox.macaroonSecretRef.key | default "root-key" }}
            {{- end }}
            {{- with .Values.finops }}
            {{- if .openCostUrl }}
            - name: DIVERGE_OPENCOST_URL
              value: {{ .openCostUrl | quote }}
            {{- end }}
            {{- if .budgetAlertThreshold }}
            - name: DIVERGE_BUDGET_ALERT_THRESHOLD
              value: {{ .budgetAlertThreshold | quote }}
            {{- end }}
            {{- with .rates }}
            {{- if ne (toString .vcpuHourUsd) "" }}
            - name: DIVERGE_COST_VCPU_HOUR_USD
              value: {{ .vcpuHourUsd | quote }}
            {{- end }}
            {{- if ne (toString .memoryGibHourUsd) "" }}
            - name: DIVERGE_COST_MEMORY_GIB_HOUR_USD
              value: {{ .memoryGibHourUsd | quote }}
            {{- end }}
            {{- if ne (toString .databaseSchemaHourUsd) "" }}
            - name: DIVERGE_COST_DB_SCHEMA_HOUR_USD
              value: {{ .databaseSchemaHourUsd | quote }}
            {{- end }}
            {{- if ne (toString .databaseDedicatedHourUsd) "" }}
            - name: DIVERGE_COST_DB_DEDICATED_HOUR_USD
              value: {{ .databaseDedicatedHourUsd | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.server.service.port }}
              protocol: TCP
            - name: http-tunnel
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
{{- end }}
