apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "diverge.fullname" . }}-controller-manager
  labels:
    control-plane: controller-manager
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      labels:
        control-plane: controller-manager
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "diverge.fullname" .) }}
      securityContext:
        runAsNonRoot: true
      containers:
      - args:
        - --metrics-addr=:8080
        - --health-probe-addr=:8081
        - --routing-provider={{ .Values.routingProvider }}
        - --leader-elect
        - --webhook-port={{ .Values.webhook.port }}
        command:
        - /diverge-controller
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        name: diverge-controller
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        ports:
        - containerPort: {{ .Values.webhook.port }}
          name: webhook-server
          protocol: TCP
        - containerPort: 8080
          name: metrics
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
