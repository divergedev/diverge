apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "diverge.fullname" . }}-controller-manager
  labels:
    control-plane: controller-manager
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      labels:
        control-plane: controller-manager
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "diverge.fullname" .) }}
      securityContext:
        runAsNonRoot: true
      containers:
      - args:
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:8081
        - --routing-provider={{ .Values.routingProvider }}
        - --leader-elect
        - --webhook-port={{ .Values.webhook.port }}
        {{- if .Values.database }}
        - --database-provider={{ .Values.database.provider | default "noop" }}
        {{- end }}
        {{- if .Values.deploy }}
        - --deploy-provider={{ .Values.deploy.provider | default "noop" }}
        {{- if eq (.Values.deploy.provider | default "noop") "direct" }}
        - --manifest-source-type={{ .Values.deploy.manifestSourceType | default "configmap" }}
        {{- end }}
        {{- end }}
        {{- if .Values.defaultNamespace }}
        - --default-namespace={{ .Values.defaultNamespace }}
        {{- end }}
        {{- if .Values.notifierProvider }}
        - --notifier-provider={{ .Values.notifierProvider }}
        {{- else if .Values.notifier }}
        - --notifier-provider={{ .Values.notifier.provider | default "noop" }}
        {{- end }}
        command:
        - /diverge-controller
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        name: diverge-controller
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        env:
        {{- if and .Values.database (ne .Values.database.provider "noop") }}
        - name: DIVERGE_DB_HOST
          value: {{ .Values.database.host | quote }}
        - name: DIVERGE_DB_PORT
          value: {{ .Values.database.port | default 5432 | quote }}
        - name: DIVERGE_DB_USER
          value: {{ .Values.database.user | quote }}
        - name: DIVERGE_DB_NAME
          value: {{ .Values.database.name | quote }}
        - name: DIVERGE_DB_SSLMODE
          value: {{ .Values.database.sslMode | default "disable" | quote }}
        {{- if .Values.database.passwordSecretName }}
        - name: DIVERGE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.database.passwordSecretName }}
              key: {{ .Values.database.passwordSecretKey | default "password" }}
        {{- end }}
        {{- end }}
        {{- if .Values.observability.otel.enabled }}
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ .Values.observability.otel.endpoint | quote }}
        {{- if .Values.observability.otel.serviceName }}
        - name: OTEL_SERVICE_NAME
          value: {{ .Values.observability.otel.serviceName | quote }}
        {{- end }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.webhook.port }}
          name: webhook-server
          protocol: TCP
        - containerPort: 8080
          name: http
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: webhook-tls
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
      volumes:
      - name: webhook-tls
        secret:
          secretName: {{ .Values.webhook.tlsSecretName | default "diverge-webhook-tls" }}
