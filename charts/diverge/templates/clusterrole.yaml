apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "diverge.fullname" . }}-controller-role
rules:
  # Diverge CRDs
  - apiGroups: ["diverge.io"]
    resources: [environments, environments/status, environments/finalizers,
                previewgroups, previewgroups/status, previewgroups/finalizers]
    verbs: [get, list, watch, create, update, patch, delete]
  # Core K8s - Namespaces
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, update, patch, delete]
  # Core K8s - Workloads
  - apiGroups: [""]
    resources: [services, secrets, configmaps, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  # Batch - Migration jobs
  - apiGroups: ["batch"]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  # Istio networking
  - apiGroups: ["networking.istio.io"]
    resources: [virtualservices, destinationrules]
    verbs: [get, list, watch, create, update, patch, delete]
  # Gateway API
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: [httproutes]
    verbs: [get, list, watch, create, update, patch, delete]
  # Events (legacy + new events.k8s.io API)
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: ["events.k8s.io"]
    resources: [events]
    verbs: [create, patch, update]
  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  # Argo CD
  - apiGroups: ["argoproj.io"]
    resources: [applicationsets, applications]
    verbs: [get, list, watch, create, update, patch, delete]
