replicaCount: 1

image:
  repository: ghcr.io/divergedev/diverge
  tag: "latest"
  pullPolicy: IfNotPresent

routingProvider: gateway  # gateway or istio

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

metrics:
  enabled: true
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s

webhook:
  port: 9443
  secretName: diverge-webhook-token

serviceAccount:
  create: true
  name: diverge-controller
  annotations: {}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
