replicaCount: 1

image:
  repository: ghcr.io/divergedev/diverge
  tag: ""  # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

routingProvider: gateway  # gateway or istio

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

metrics:
  enabled: true
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
  cloudMonitoringDashboard:
    enabled: false

observability:
  otel:
    enabled: false
    endpoint: ""
    serviceName: ""
  autoInstrumentation:
    enabled: false
    endpoint: "otel-collector.observability:4317"
    go:
      enabled: false  # eBPF needs CAP_SYS_PTRACE, disabled by default

grafana:
  dashboards:
    enabled: true

prometheus:
  alerts:
    enabled: false  # requires Prometheus Operator CRDs (monitoring.coreos.com)

webhook:
  port: 9443
  secretName: diverge-webhook-token

deploy:
  provider: "noop"  # argocd | direct | noop
  manifestSourceType: "configmap"  # configmap | url (for direct deployer)

# Database configuration for preview schema isolation
database:
  # Database provider: noop (disabled), shared (shared DB), schema (per-preview schemas)
  provider: "noop"
  # PostgreSQL connection settings (required when provider is 'schema')
  host: ""
  port: 5432
  user: "postgres"
  name: "diverge_preview"
  # SSL mode for PostgreSQL. Use 'require' for production, 'disable' for local development.
  sslMode: "require"
  # Reference to existing K8s Secret containing the database password
  passwordSecretName: ""
  passwordSecretKey: "password"
  # SetupJob configures the K8s Job that executes the schema initialization SQL
  setupJob:
    image: "postgres:17-alpine@sha256:7456ef82e5f5bc43d997f4781bbd7c0d6389bff397564649a356e206ba473aee"

serviceAccount:
  create: true
  name: diverge-controller
  annotations: {}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}

proxy:
  enabled: false
  replicaCount: 1
  port: 8090
  previewDomain: ""
  upstream: ""
  headerKey: "x-preview-env"
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  service:
    type: ClusterIP
    port: 80
    targetPort: 8090

activatorProxy:
  enabled: false
  replicas: 1
  image:
    repository: ghcr.io/divergedev/activator-proxy
    tag: ""  # defaults to .Chart.AppVersion
  port: 8080
  activatorUrl: ""
  targetNamespace: "default"
  targetSelector: ""
  targetPort: 8080
  targetRevision: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

server:
  enabled: false
  replicaCount: 1
  image:
    repository: ""  # defaults to same as controller
    tag: ""  # defaults to .Chart.AppVersion
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  service:
    type: ClusterIP
    port: 8443
  auth:
    tokenCacheTTL: 5s
    audiences:
      - diverge-server
    maxStreams: 250
    maxStreamsPerUser: 20
    # -- OIDC SSO configuration. When enabled, users can log in via an
    # OpenID Connect provider (Okta, Google, Auth0, Keycloak, etc.)
    oidc:
      enabled: false
      # -- OIDC provider issuer URL (e.g. https://accounts.google.com)
      issuerUrl: ""
      # -- OIDC client ID registered with your provider
      clientId: ""
      # -- Kubernetes Secret containing the OIDC client secret
      clientSecretSecretRef:
        name: ""
        key: "clientSecret"
      # -- Public callback URL (must match your OIDC provider config)
      # e.g. https://diverge.example.com/auth/callback
      redirectUrl: ""
      # -- Display name for the SSO button (e.g. "Google", "Okta")
      providerName: "SSO"
      # -- OIDC scopes to request
      scopes: "openid,profile,email,groups"
      # -- JWT claim used for username
      usernameClaim: "preferred_username"
      # -- JWT claim used for group membership
      groupsClaim: "groups"
      # -- Restrict access to users in these groups (comma-separated, empty = all)
      allowedGroups: ""
    # -- Session JWT configuration (used for OIDC sessions)
    session:
      # -- Session cookie max age in seconds
      maxAge: 86400
      # -- Kubernetes Secret containing HMAC signing key (base64).
      # If not set, a random key is generated on startup (sessions
      # won't survive restarts).
      secretRef:
        name: ""
        key: "session-secret"
  cors:
    # WARNING: When AllowCredentials is true, you MUST set specific origins.
    # Using "*" with credentials is a CSRF vulnerability.
    allowedOrigins: "*"
    allowCredentials: false  # set to true only with explicit origins
    maxAge: 86400
  dashboard:
    # -- Enable the embedded web dashboard at /
    enabled: true
  rbac:
    # -- If true, grants cluster-wide pods/log access via ClusterRole.
    # If false, restricts pods/log access to targetNamespaces only.
    # When false and targetNamespaces is empty, NO pod access is granted.
    clusterWidePodAccess: true
    # -- List of namespaces where the server can access pods/log.
    # Only used when clusterWidePodAccess is false.
    # NOTE: Target namespaces must exist before helm install/upgrade.
    # The chart does NOT create these namespaces.
    targetNamespaces: []
  metrics:
    serviceMonitor:
      enabled: false
      interval: 30s

# cert-manager integration for webhook TLS
certManager:
  # -- Enable cert-manager Certificate/Issuer for webhook TLS.
  # When false, you must create the TLS secret manually.
  enabled: false
  # -- Issuer kind: Issuer (namespace-scoped) or ClusterIssuer
  issuerKind: Issuer
  # -- Issuer name. Empty = create a self-signed Issuer automatically.
  issuerName: ""

rbac:
  # -- Scope the controller's permissions to specific namespaces.
  # When false (default), a ClusterRole is used for cluster-wide access.
  namespaceScoped: false
  # -- List of namespaces to manage when namespaceScoped is true.
  managedNamespaces: []
