replicaCount: 1

image:
  repository: ghcr.io/divergedev/diverge
  tag: "latest"
  pullPolicy: IfNotPresent

routingProvider: gateway  # gateway or istio

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

metrics:
  enabled: true
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
  grafanaDashboard:
    enabled: false
  cloudMonitoringDashboard:
    enabled: false

webhook:
  port: 9443
  secretName: diverge-webhook-token

deploy:
  provider: "noop"  # argocd | direct | noop
  manifestSourceType: "configmap"  # configmap | url (for direct deployer)

# Database configuration for preview schema isolation
database:
  # Database provider: noop (disabled), shared (shared DB), schema (per-preview schemas)
  provider: "noop"
  # PostgreSQL connection settings (required when provider is 'schema')
  host: ""
  port: 5432
  user: "postgres"
  name: "diverge_preview"
  sslMode: "disable"
  # Reference to existing K8s Secret containing the database password
  passwordSecretName: ""
  passwordSecretKey: "password"

serviceAccount:
  create: true
  name: diverge-controller
  annotations: {}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}

proxy:
  enabled: false
  replicaCount: 1
  port: 8090
  previewDomain: ""
  upstream: ""
  headerKey: "x-diverge-env"
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  service:
    type: ClusterIP
    port: 80
    targetPort: 8090
