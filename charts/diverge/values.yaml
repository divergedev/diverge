replicaCount: 1

image:
  repository: ghcr.io/divergedev/diverge
  tag: "latest"
  pullPolicy: IfNotPresent

routingProvider: gateway  # gateway or istio

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

metrics:
  enabled: true
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s

webhook:
  port: 9443
  secretName: diverge-webhook-token

serviceAccount:
  create: true
  name: diverge-controller
  annotations: {}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}

proxy:
  enabled: false
  replicaCount: 1
  port: 8090
  previewDomain: ""
  upstream: ""
  headerKey: "x-diverge-env"
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  service:
    type: ClusterIP
    port: 80
    targetPort: 8090
