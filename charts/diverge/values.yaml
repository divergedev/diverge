replicaCount: 1

server:
  metrics:
    serviceMonitor:
      enabled: false
      interval: 30s


image:
  repository: ghcr.io/divergedev/diverge
  tag: "v0.4.0"
  pullPolicy: IfNotPresent

routingProvider: gateway  # gateway or istio

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

metrics:
  enabled: true
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
  cloudMonitoringDashboard:
    enabled: false

grafana:
  dashboards:
    enabled: true

prometheus:
  alerts:
    enabled: true

webhook:
  port: 9443
  secretName: diverge-webhook-token

deploy:
  provider: "noop"  # argocd | direct | noop
  manifestSourceType: "configmap"  # configmap | url (for direct deployer)

# Database configuration for preview schema isolation
database:
  # Database provider: noop (disabled), shared (shared DB), schema (per-preview schemas)
  provider: "noop"
  # PostgreSQL connection settings (required when provider is 'schema')
  host: ""
  port: 5432
  user: "postgres"
  name: "diverge_preview"
  # SSL mode for PostgreSQL. Use 'require' for production, 'disable' for local development.
  sslMode: "require"
  # Reference to existing K8s Secret containing the database password
  passwordSecretName: ""
  passwordSecretKey: "password"

serviceAccount:
  create: true
  name: diverge-controller
  annotations: {}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}

proxy:
  enabled: false
  replicaCount: 1
  port: 8090
  previewDomain: ""
  upstream: ""
  headerKey: "x-preview-env"
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  service:
    type: ClusterIP
    port: 80
    targetPort: 8090

activatorProxy:
  enabled: false
  replicas: 1
  image:
    repository: ghcr.io/divergedev/activator-proxy
    tag: v0.4.0
  port: 8080
  activatorUrl: ""
  targetNamespace: "default"
  targetSelector: ""
  targetPort: 8080
  targetRevision: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
