<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="5">
<title>Deploying...</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 3rem; color: #333; background: #f9f9f9; display: flex; justify-content: center; align-items: center; min-height: 80vh; }
.container { text-align: center; max-width: 500px; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
.spinner {
	width: 50px;
	height: 50px;
	border: 5px solid #f3f3f3;
	border-top: 5px solid #3498db;
	border-radius: 50%;
	animation: spin 1s linear infinite;
	margin: 0 auto 20px;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
h1 { font-size: 1.5rem; margin-bottom: 1rem; }
.meta { color: #666; font-size: 0.9rem; margin-top: 2rem; }
</style>
</head>
<body>
<div class="container">
	<div class="spinner"></div>
	<h1>Your preview environment is deploying...</h1>
	<p>Environment: <strong>{{.Name}}</strong></p>
	<p>Current Status: <strong>{{.Phase}}</strong></p>
	<p class="meta">Please wait. This page will automatically refresh every 5 seconds.</p>
</div>
</body>
</html>
