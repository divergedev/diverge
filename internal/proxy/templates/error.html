<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Deployment Failed</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 3rem; color: #333; background: #f9f9f9; display: flex; justify-content: center; align-items: center; min-height: 80vh; }
.container { text-align: center; max-width: 500px; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 4px solid #d32f2f; }
h1 { color: #d32f2f; font-size: 1.5rem; margin-bottom: 1rem; }
.error-box { background: #ffebee; color: #c62828; padding: 1rem; border-radius: 4px; margin: 1.5rem 0; text-align: left; font-family: monospace; }
</style>
</head>
<body>
<div class="container">
	<h1>Environment failed to deploy</h1>
	<p>Environment: <strong>{{.Env.Name}}</strong></p>
	<div class="error-box">
		{{.Error}}
	</div>
	<p>Please check the logs or contact the administrator.</p>
</div>
</body>
</html>
