syntax = "proto3";

package diverge.v1alpha1;

option go_package = "github.com/divergedev/diverge/gen/diverge/v1alpha1;divergev1alpha1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "diverge/v1alpha1/environment.proto";

// --- PreviewGroup Enums ---

// PreviewGroupPhase represents the lifecycle state of a preview group.
enum PreviewGroupPhase {
  PREVIEW_GROUP_PHASE_UNSPECIFIED = 0;
  PREVIEW_GROUP_PHASE_PENDING = 1;
  PREVIEW_GROUP_PHASE_DEPLOYING = 2;
  PREVIEW_GROUP_PHASE_RUNNING = 3;
  PREVIEW_GROUP_PHASE_DEGRADED = 4;
  PREVIEW_GROUP_PHASE_FAILED = 5;
  PREVIEW_GROUP_PHASE_TERMINATING = 6;
}

// ServiceMode defines how a service is deployed in a preview group.
enum ServiceMode {
  // IMAGE: deploy a container image as a preview pod (default).
  SERVICE_MODE_UNSPECIFIED = 0;
  // IMAGE: deploy a container image as a preview pod.
  SERVICE_MODE_IMAGE = 1;
  // LOCAL: route traffic to an external endpoint (e.g. developer's Tailscale IP).
  SERVICE_MODE_LOCAL = 2;
  // BASELINE: include the existing baseline service in group routing without redeploying.
  SERVICE_MODE_BASELINE = 3;
}

// Protocol defines the transport protocol for a service.
enum ServiceProtocol {
  SERVICE_PROTOCOL_UNSPECIFIED = 0;
  // HTTP: standard HTTP/1.1 or HTTP/2 (including ConnectRPC).
  SERVICE_PROTOCOL_HTTP = 1;
  // GRPC: raw gRPC over HTTP/2. Generates GRPCRoute instead of HTTPRoute.
  SERVICE_PROTOCOL_GRPC = 2;
}

// --- PreviewGroup Messages ---

// PreviewGroupRouting configures how traffic reaches preview services.
message PreviewGroupRouting {
  // Routing mode (default: "header").
  RoutingMode mode = 1;
  // The HTTP header key used for routing (default: "x-preview-env").
  string header_key = 2;
  // The header value that identifies this preview group.
  string header_value = 3;
  // Optional external URL for shareable preview access.
  string external_url = 4;
}

// PreviewGroupService defines a single service in a preview group.
// Only name is required; namespace, port, parentRef, and pathPrefix
// are auto-discovered from existing Kubernetes Services if omitted.
message PreviewGroupService {
  // Name of the Kubernetes Service to preview. Required.
  string name = 1;

  // Container image to deploy (required for mode=IMAGE).
  string image = 2;

  // How this service participates in the preview group.
  ServiceMode mode = 3;

  // External endpoint for mode=LOCAL (e.g. "100.64.23.42:8080" for Tailscale).
  string endpoint = 4;

  // Target namespace. Auto-discovered from existing Service if empty.
  string namespace = 5;

  // Container port. Auto-discovered from existing Service if 0.
  int32 port = 6;

  // Gateway API parentRef name. Auto-discovered if empty.
  string parent_ref = 7;

  // URL path prefix for HTTPRoute matching. Auto-discovered if empty.
  string path_prefix = 8;

  // Transport protocol. Determines HTTPRoute vs GRPCRoute generation.
  ServiceProtocol protocol = 9;

  // Kubernetes imagePullPolicy for the preview pod.
  string image_pull_policy = 10;

  // Additional environment variables for the preview pod.
  repeated EnvVar env = 11;

  // Resource overrides for preview pods (typically lower than baseline).
  ResourceOverride resources = 12;

  // Per-service database configuration override.
  EnvironmentDatabase database = 13;
}

// EnvVar defines an environment variable for a preview pod.
message EnvVar {
  string name = 1;
  string value = 2;
}

// ResourceOverride allows preview pods to use fewer resources than baseline.
// If unset, the controller defaults to conservative values (100m CPU, 256Mi RAM).
message ResourceOverride {
  string cpu_request = 1;     // e.g. "100m"
  string memory_request = 2;  // e.g. "256Mi"
  string cpu_limit = 3;
  string memory_limit = 4;
}

// PreviewGroupLifecycle configures automatic cleanup and TTL for the group.
message PreviewGroupLifecycle {
  // Time-to-live for the preview group.
  google.protobuf.Duration ttl = 1;
  // Whether to automatically delete on MR merge/close.
  bool cleanup_on_merge = 2;
}

// --- Top-level PreviewGroup ---

// PreviewGroupSpec defines the desired state of a PreviewGroup.
message PreviewGroupSpec {
  // Source SCM context (GitLab MR, GitHub PR, etc.)
  EnvironmentSource source = 1;
  // Routing configuration shared by all services in the group.
  PreviewGroupRouting routing = 2;
  // Services to include in this preview group.
  repeated PreviewGroupService services = 3;
  // Database configuration shared by all services (overridable per-service).
  EnvironmentDatabase database = 4;
  // Lifecycle and cleanup configuration.
  PreviewGroupLifecycle lifecycle = 5;
}

// PreviewGroupServiceStatus reports the current state of a single service.
message PreviewGroupServiceStatus {
  // Service name.
  string name = 1;
  // Name of the child Environment CR created for this service.
  string environment_name = 2;
  // Namespace where the preview pod is deployed.
  string namespace = 3;
  // Current phase of this service's preview.
  EnvironmentPhase phase = 4;
  // Reachable URL for this service.
  string url = 5;
  // Human-readable status message.
  string message = 6;
  // Machine-readable failure reason (e.g. "CrashLoopBackOff", "ImagePullBackOff").
  string reason = 7;
  // Last few lines from the preview pod's container logs (for quick debugging).
  string last_log_snippet = 8;
}

// PreviewGroupStatus describes the observed state of a PreviewGroup.
message PreviewGroupStatus {
  // Aggregated phase across all services.
  PreviewGroupPhase phase = 1;
  // Total number of services in the group.
  int32 service_count = 2;
  // Per-service status.
  repeated PreviewGroupServiceStatus services = 3;
  // Last observed generation of the spec.
  int64 observed_generation = 4;
  // When the preview group was created.
  google.protobuf.Timestamp created_at = 5;
  // When the preview group will expire (TTL).
  google.protobuf.Timestamp expires_at = 6;
  // Status conditions (Ready, Degraded, etc.)
  repeated StatusCondition conditions = 7;
  // External system comment ID for the preview group status.
  int64 comment_id = 8;
}

// PreviewGroup represents a collection of related preview services
// deployed together from a single MR/PR. It is the "operator of operators"
// that creates and manages child Environment CRs.
message PreviewGroup {
  // Unique name of the preview group (e.g. "mr-42").
  string name = 1;
  // Desired state.
  PreviewGroupSpec spec = 2;
  // Observed state.
  PreviewGroupStatus status = 3;
}
