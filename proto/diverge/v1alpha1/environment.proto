syntax = "proto3";

package diverge.v1alpha1;

option go_package = "github.com/divergedev/diverge/gen/diverge/v1alpha1;divergev1alpha1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// EnvironmentPhase represents the lifecycle state of a preview environment.
enum EnvironmentPhase {
  ENVIRONMENT_PHASE_UNSPECIFIED = 0;
  ENVIRONMENT_PHASE_PENDING = 1;
  ENVIRONMENT_PHASE_DEPLOYING = 2;
  ENVIRONMENT_PHASE_RUNNING = 3;
  ENVIRONMENT_PHASE_FAILED = 4;
  ENVIRONMENT_PHASE_TERMINATING = 5;
}

// DatabaseMode defines the level of database isolation for a preview environment.
enum DatabaseMode {
  DATABASE_MODE_UNSPECIFIED = 0;
  DATABASE_MODE_SHARED = 1;
  DATABASE_MODE_SCHEMA = 2;
  DATABASE_MODE_SNAPSHOT = 3;
  DATABASE_MODE_FRESH = 4;
}

// DeployMode defines how services are deployed in a preview environment.
enum DeployMode {
  DEPLOY_MODE_UNSPECIFIED = 0;
  DEPLOY_MODE_DELTA = 1;
  DEPLOY_MODE_FULL = 2;
}

// RoutingMode defines how traffic reaches a preview environment.
enum RoutingMode {
  ROUTING_MODE_UNSPECIFIED = 0;
  ROUTING_MODE_HEADER = 1;
  ROUTING_MODE_NAMESPACE = 2;
  ROUTING_MODE_SUBDOMAIN = 3;
}

// RoutingProvider defines which routing implementation to use.
enum RoutingProvider {
  ROUTING_PROVIDER_UNSPECIFIED = 0;
  ROUTING_PROVIDER_ISTIO = 1;
  ROUTING_PROVIDER_GATEWAY = 2;
}

// SourceProvider identifies the SCM platform.
enum SourceProvider {
  SOURCE_PROVIDER_UNSPECIFIED = 0;
  SOURCE_PROVIDER_GITLAB = 1;
  SOURCE_PROVIDER_GITHUB = 2;
}

// CommitStatusState represents the state of a commit status check.
enum CommitStatusState {
  COMMIT_STATUS_STATE_UNSPECIFIED = 0;
  COMMIT_STATUS_STATE_PENDING = 1;
  COMMIT_STATUS_STATE_RUNNING = 2;
  COMMIT_STATUS_STATE_SUCCESS = 3;
  COMMIT_STATUS_STATE_FAILED = 4;
  COMMIT_STATUS_STATE_CANCELED = 5;
}

// SourceType defines whether a service uses Helm or Kustomize.
enum SourceType {
  SOURCE_TYPE_UNSPECIFIED = 0;
  SOURCE_TYPE_HELM = 1;
  SOURCE_TYPE_KUSTOMIZE = 2;
}

// NamespaceMode defines how the preview namespace is provisioned.
enum NamespaceMode {
  NAMESPACE_MODE_UNSPECIFIED = 0;
  NAMESPACE_MODE_SAME = 1;
  NAMESPACE_MODE_CREATE = 2;
}

// --- Inner types used in CRD status ---

// StatusCondition mirrors metav1.Condition for proto consumers.
message StatusCondition {
  string type = 1;
  string status = 2;     // "True", "False", "Unknown"
  string reason = 3;
  string message = 4;
  google.protobuf.Timestamp last_transition_time = 5;
}

// DatabaseStatus reports the state of database provisioning.
message DatabaseStatus {
  bool ready = 1;
  string connection_secret = 2;
  string message = 3;
  string schema_name = 4;
}

// --- Source/Spec sub-messages ---

message EnvironmentSource {
  SourceProvider provider = 1;
  string project = 2;
  int32 mr = 3;
  string branch = 4;
  string commit_sha = 5;
}

message EnvironmentDeploy {
  DeployMode mode = 1;
  NamespaceMode namespace = 2;
  repeated string changed_services = 3;
  string baseline_ref = 4;
  map<string, string> namespace_labels = 5;
}

message EnvironmentRouting {
  RoutingMode mode = 1;
  RoutingProvider provider = 2;
  string header_key = 3;
  string header_value = 4;
  string external_url = 5;
}

message EnvironmentDatabase {
  DatabaseMode mode = 1;
  string connection_ref = 2;
  string seed_source = 3;
}

message EnvironmentLifecycle {
  google.protobuf.Duration ttl = 1;
  bool cleanup_on_merge = 2;
}

// --- Top-level messages ---

message EnvironmentSpec {
  EnvironmentSource source = 1;
  EnvironmentDeploy deploy = 2;
  EnvironmentRouting routing = 3;
  EnvironmentDatabase database = 4;
  EnvironmentLifecycle lifecycle = 5;
}

message EnvironmentStatusProto {
  EnvironmentPhase phase = 1;
  string url = 2;
  repeated string services = 3;
  string database_status = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  int64 observed_generation = 7;
  repeated StatusCondition conditions = 8;
  // New fields (Phase 4)
  string commit_sha = 9;
  int64 comment_id = 10;
  string commit_status_url = 11;
}

message Environment {
  string name = 1;
  string namespace = 2;
  EnvironmentSpec spec = 3;
  EnvironmentStatusProto status = 4;
}


