syntax = "proto3";

package diverge.v1alpha1;

option go_package = "github.com/divergedev/diverge/gen/diverge/v1alpha1;divergev1alpha1";

import "diverge/v1alpha1/environment.proto";
import "diverge/v1alpha1/previewgroup.proto";

// --- Environment API (existing) ---

message CreateEnvironmentRequest {
  string namespace = 1;
  EnvironmentSpec spec = 2;
}

message CreateEnvironmentResponse {
  Environment environment = 1;
}

message GetEnvironmentRequest {
  string namespace = 1;
  string name = 2;
}

message GetEnvironmentResponse {
  Environment environment = 1;
}

message ListEnvironmentsRequest {
  string namespace = 1;
  // Optional filters
  EnvironmentPhase phase = 2;
  string branch = 3;
}

message ListEnvironmentsResponse {
  repeated Environment environments = 1;
}

message DeleteEnvironmentRequest {
  string namespace = 1;
  string name = 2;
}

message DeleteEnvironmentResponse {}

// EnvironmentService provides programmatic environment management.
// This is the foundation for issue #12 (ConnectRPC API server).
service EnvironmentService {
  rpc CreateEnvironment(CreateEnvironmentRequest) returns (CreateEnvironmentResponse);
  rpc GetEnvironment(GetEnvironmentRequest) returns (GetEnvironmentResponse);
  rpc ListEnvironments(ListEnvironmentsRequest) returns (ListEnvironmentsResponse);
  rpc DeleteEnvironment(DeleteEnvironmentRequest) returns (DeleteEnvironmentResponse);
}

// --- PreviewGroup API ---

message CreatePreviewGroupRequest {
  PreviewGroupSpec spec = 1;
  // Name for the preview group (e.g. "mr-42").
  string name = 2;
}

message CreatePreviewGroupResponse {
  PreviewGroup preview_group = 1;
}

message GetPreviewGroupRequest {
  string name = 1;
}

message GetPreviewGroupResponse {
  PreviewGroup preview_group = 1;
}

message ListPreviewGroupsRequest {
  // Optional label selector (e.g. "diverge.io/source-project=azra/platform").
  string label_selector = 1;
}

message ListPreviewGroupsResponse {
  repeated PreviewGroup preview_groups = 1;
}

message DeletePreviewGroupRequest {
  string name = 1;
}

message DeletePreviewGroupResponse {}

message WatchPreviewGroupRequest {
  string name = 1;
}

message WatchPreviewGroupResponse {
  // Event type: ADDED, MODIFIED, DELETED
  string type = 1;
  PreviewGroup preview_group = 2;
}

// PreviewGroupAPIService provides programmatic preview group management.
// Used by CLI, GitLab CI Component, dashboards, and SDKs.
// v1: CLI uses client-go directly. v1.1: ConnectRPC server implementation.
service PreviewGroupAPIService {
  rpc CreatePreviewGroup(CreatePreviewGroupRequest) returns (CreatePreviewGroupResponse);
  rpc GetPreviewGroup(GetPreviewGroupRequest) returns (GetPreviewGroupResponse);
  rpc ListPreviewGroups(ListPreviewGroupsRequest) returns (ListPreviewGroupsResponse);
  rpc DeletePreviewGroup(DeletePreviewGroupRequest) returns (DeletePreviewGroupResponse);
  rpc WatchPreviewGroup(WatchPreviewGroupRequest) returns (stream WatchPreviewGroupResponse);
}
