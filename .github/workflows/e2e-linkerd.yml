name: E2E Linkerd Conformance
on:
  schedule:
    - cron: '0 6 * * *' # Nightly at 6am UTC
  workflow_dispatch: # Manual trigger

jobs:
  e2e-linkerd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Kind
        run: go install sigs.k8s.io/kind@v0.29.0
      - name: Setup Linkerd cluster
        run: make e2e-linkerd-setup
      - name: Run Linkerd conformance tests
        run: make e2e-linkerd-run
      - name: Teardown
        if: always()
        run: make e2e-linkerd-teardown
