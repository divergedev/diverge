name: E2E Cilium Conformance
on:
  schedule:
    - cron: '0 6 * * *' # Nightly at 6am UTC
  workflow_dispatch: # Manual trigger

jobs:
  e2e-cilium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Kind
        run: go install sigs.k8s.io/kind@v0.29.0
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0
      - name: Setup Cilium cluster
        run: make e2e-cilium-setup
      - name: Run Cilium conformance tests
        run: make e2e-cilium-run
      - name: Teardown
        if: always()
        run: make e2e-cilium-teardown
