name: E2E Istio Conformance

permissions:
  contents: read

on:
  schedule:
    - cron: '0 6 * * *' # Nightly at 6am UTC
  workflow_dispatch: # Manual trigger

jobs:
  e2e-istio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install Kind
        run: go install sigs.k8s.io/kind@v0.29.0
      - name: Setup Istio cluster
        run: make e2e-istio-setup
      - name: Run Istio conformance tests
        run: make e2e-istio-run
      - name: Dump controller diagnostics on failure
        if: failure()
        run: |
          kubectl --context kind-diverge-istio get environments -A -o yaml || true
          kubectl --context kind-diverge-istio -n diverge-system logs -l control-plane=controller-manager --tail=200 || true
      - name: Teardown
        if: always()
        run: make e2e-istio-teardown
