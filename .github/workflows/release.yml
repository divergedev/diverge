name: Release
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '!*-*'
jobs:
  release:
    if: "!contains(github.ref_name, '-')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - uses: bufbuild/buf-action@e8b15693be91ae73e965d157c722987338c768b3 # v1
        with:
          setup_only: true
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1
      - name: Install syft
        uses: anchore/sbom-action/download-syft@61119d458adab75f756bc0b9e4bde25725f86a7a # v0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      - name: Update floating v1 GitHub Action tag and branch
        if: "!contains(github.ref_name, '-')"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping v1 update for non-stable tag ${RELEASE_TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa v1 -m "Update v1 action tag to ${RELEASE_TAG}" "${GITHUB_SHA}"
          git push origin refs/tags/v1 --force
          git push origin "${GITHUB_SHA}:refs/heads/v1" --force
      - name: Extract tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Sync CRDs to Helm chart
        run: |
          rm -f charts/diverge/crds/*.yaml
          cp config/crd/bases/*.yaml charts/diverge/crds/
      - name: Package Helm chart
        env:
          CHART_VERSION: ${{ steps.tag.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          helm package charts/diverge --version "${CHART_VERSION}" --app-version "${RELEASE_TAG}"
      - name: Push Helm chart to OCI
        env:
          CHART_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          helm push "diverge-${CHART_VERSION}.tgz" oci://ghcr.io/divergedev/charts
      - name: Generate SBOM
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          syft "ghcr.io/divergedev/diverge:${RELEASE_TAG}" -o spdx-json > diverge-sbom.spdx.json
          syft "ghcr.io/divergedev/activator-proxy:${RELEASE_TAG}" -o spdx-json > activator-proxy-sbom.spdx.json
          syft "ghcr.io/divergedev/diverge-cli:${RELEASE_TAG}" -o spdx-json > diverge-cli-sbom.spdx.json
      - name: Sign container image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cosign sign --yes "ghcr.io/divergedev/diverge:${RELEASE_TAG}"
          cosign sign --yes "ghcr.io/divergedev/activator-proxy:${RELEASE_TAG}"
          cosign sign --yes "ghcr.io/divergedev/diverge-cli:${RELEASE_TAG}"
      - name: Attach SBOM
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cosign attach sbom --sbom diverge-sbom.spdx.json "ghcr.io/divergedev/diverge:${RELEASE_TAG}"
          cosign attach sbom --sbom activator-proxy-sbom.spdx.json "ghcr.io/divergedev/activator-proxy:${RELEASE_TAG}"
          cosign attach sbom --sbom diverge-cli-sbom.spdx.json "ghcr.io/divergedev/diverge-cli:${RELEASE_TAG}"

  release-sdks:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Build and publish Node.js SDK (@divergedev/sdk)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          cd pkg/sdk/node
          npm version "${VERSION}" --no-git-tag-version --allow-same-version
          PKG_VERSION="$(jq -r .version package.json)"
          if [ "${PKG_VERSION}" != "${VERSION}" ]; then
            echo "ERROR: pkg/sdk/node/package.json version (${PKG_VERSION}) does not match release tag (${VERSION})"
            exit 1
          fi
          npm ci && npm run build && npm test && npm pack
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm publish --provenance --access public
          else
            echo "NPM_TOKEN not set, skipping npm publish"
          fi
      - name: Build Python SDK (diverge-sdk)
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          cd pkg/sdk/python
          sed -i.bak "s/^version = .*/version = \"${VERSION}\"/" pyproject.toml && rm -f pyproject.toml.bak
          pip install build && python -m build
      - name: Upload SDK distributions to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "${RELEASE_TAG}" pkg/sdk/node/*.tgz pkg/sdk/python/dist/* --clobber
