name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Test
        run: |
          # E2E tests in /test/ are filtered out because they require a real cluster
          # and are run in a separate workflow (e2e.yaml) using the 'e2e' build tag.
          PACKAGES=$(go list ./... | grep -v '/gen/' | grep -v '/test/' | tr '\n' ' ')
          go test $PACKAGES -race -coverprofile=coverage.out
      - name: Coverage Check
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below the 60% threshold"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets threshold"
      - name: Vet
        run: go vet ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - name: Run golangci-lint
        run: golangci-lint run

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint Helm Chart
        run: helm lint charts/diverge

  check-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.52.1'
          github_token: ${{ github.token }}
      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@$(grep google.golang.org/protobuf go.mod | awk '{print $2}')
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@$(grep connectrpc.com/connect go.mod | awk '{print $2}')
      - name: Proto lint and breaking check
        run: |
          buf lint api/proto
          buf breaking api/proto --against 'https://github.com/divergedev/diverge.git#branch=main' || true
      - name: Run code generation
        run: buf generate
      - name: Check for stale generated files
        run: |
          DIFF=$(git diff -I 'protoc-gen-go v' --stat api/gen/diverge/ 2>/dev/null || true)
          UNTRACKED=$(git ls-files --others --exclude-standard -- api/gen/diverge/ 2>/dev/null || true)
          if [[ -n "$DIFF" || -n "$UNTRACKED" ]]; then
            echo "❌ Generated protobuf/connect files are stale!"
            echo ""
            [[ -n "$DIFF" ]] && echo "Modified:" && echo "$DIFF"
            [[ -n "$UNTRACKED" ]] && echo "Untracked:" && echo "$UNTRACKED"
            echo ""
            echo "Run 'make proto' and commit the updated api/gen/ directory."
            exit 1
          fi
          echo "✅ Generated files are up-to-date"

  test-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check PBT coverage for CRD types
        run: bash scripts/check-pbt-coverage.sh
      - name: Check test file co-location
        run: bash scripts/check-test-coverage.sh
