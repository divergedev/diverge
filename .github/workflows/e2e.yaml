name: E2E Tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Kind
        run: go install sigs.k8s.io/kind@v0.29.0
      - name: Setup cluster
        run: make e2e-setup
      - name: Run E2E
        run: make e2e-run
      - name: Teardown
        if: always()
        run: make e2e-teardown
