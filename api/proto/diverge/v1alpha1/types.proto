syntax = "proto3";

package diverge.v1alpha1;

option go_package = "github.com/divergedev/diverge/api/gen/diverge/v1alpha1;divergev1alpha1";



// WatchEventType enumerates the types of watch events.
enum WatchEventType {
  WATCH_EVENT_TYPE_UNSPECIFIED = 0;
  WATCH_EVENT_TYPE_ADDED = 1;
  WATCH_EVENT_TYPE_MODIFIED = 2;
  WATCH_EVENT_TYPE_DELETED = 3;
  WATCH_EVENT_TYPE_ERROR = 4;
  WATCH_EVENT_TYPE_BOOKMARK = 5;
}

// PaginationRequest contains pagination parameters for list requests.
message PaginationRequest {
  int32 page_size = 1;
  string page_token = 2;
}

// PaginationResponse contains pagination metadata for list responses.
message PaginationResponse {
  string next_page_token = 1;
  int32 total_size = 2;
}
