syntax = "proto3";

package diverge.v1alpha1;

option go_package = "github.com/divergedev/diverge/api/gen/diverge/v1alpha1;divergev1alpha1";

enum RoutingMode {
  ROUTING_MODE_UNSPECIFIED = 0;
  ROUTING_MODE_HEADER = 1;
  ROUTING_MODE_SUBDOMAIN = 2;
  ROUTING_MODE_ASYNC = 3;
}

message PropagationContext {
  string environment = 1;
  RoutingMode routing_mode = 2;
  map<string, string> metadata = 3;
}
