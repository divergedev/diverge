syntax = "proto3";

package diverge.v1alpha1;

option go_package = "github.com/divergedev/diverge/api/gen/diverge/v1alpha1;divergev1alpha1";

service ClusterService {
  rpc GetClusterInfo(GetClusterInfoRequest) returns (GetClusterInfoResponse);
}

message GetClusterInfoRequest {}

message NamespaceQuotaInfo {
  int32 max_active_environments = 1;
  int32 max_cnpg_clusters = 2;
  double max_hourly_cost_usd = 3;
  string quota_exceed_policy = 4;
}

message GetClusterInfoResponse {
  int32 environment_count = 1;
  int32 preview_group_count = 2;
  string controller_version = 3;
  repeated string namespaces = 4;
  bool controller_healthy = 5;
  NamespaceQuotaInfo namespace_quota = 6;
}
