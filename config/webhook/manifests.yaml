---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-diverge-io-v1alpha1-previewgroup
  failurePolicy: Fail
  name: vpreviewgroup.diverge.io
  rules:
  - apiGroups:
    - diverge.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - previewgroups
  sideEffects: None
