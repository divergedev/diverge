apiVersion: divergedev.com/v1alpha1
kind: Environment
metadata:
  name: preview-mr-310-keda
  namespace: default
  annotations:
    divergedev.com/hibernate-after: "30m"
spec:
  source:
    provider: github
    project: example-org/checkout-service
    mr: 310
    branch: feat/express-checkout
  deploy:
    mode: delta
    namespace: same
  routing:
    provider: gateway
    mode: header
    headerKey: x-diverge-env
    headerValue: preview-mr-310-keda
  serviceConfig:
    serviceName: checkout-api
    namespace: default
    port: 8080
    image: registry.example.com/checkout-api:mr-310
    keda:
      enabled: true
      minReplicas: 0
      maxReplicas: 5
      cooldownPeriod: 300
  lifecycle:
    ttl: 72h
    cleanupOnMerge: true
