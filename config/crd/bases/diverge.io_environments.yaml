---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: environments.diverge.io
spec:
  group: diverge.io
  names:
    kind: Environment
    listKind: EnvironmentList
    plural: environments
    singular: environment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: The current phase of the environment
      jsonPath: .status.phase
      name: Phase
      type: string
    - description: The external URL of the environment
      jsonPath: .status.url
      name: URL
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Environment is the Schema for the environments API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EnvironmentSpec defines the desired state of Environment
            properties:
              database:
                description: EnvironmentDatabase defines the database configuration
                properties:
                  connectionRef:
                    type: string
                  migrationJob:
                    description: MigrationJobSpec configures a Kubernetes Job for
                      database migrations.
                    properties:
                      args:
                        description: Args specifies the arguments to pass to the migration
                          job container.
                        items:
                          type: string
                        type: array
                      envFrom:
                        description: EnvFrom specifies environment variables to inject
                          from Secrets.
                        items:
                          description: SecretRef references a specific key within
                            a Kubernetes Secret.
                          properties:
                            key:
                              description: Key is the specific key in the Secret to
                                reference.
                              type: string
                            name:
                              description: Name is the name of the Secret.
                              type: string
                            namespace:
                              description: Namespace is the namespace of the Secret.
                              type: string
                          type: object
                        type: array
                      image:
                        description: Image is the container image to use for the migration
                          job.
                        type: string
                      timeoutSeconds:
                        description: TimeoutSeconds is the maximum duration the migration
                          job can run before being terminated.
                        format: int32
                        type: integer
                    type: object
                  mode:
                    enum:
                    - shared
                    - schema
                    - snapshot
                    - fresh
                    type: string
                  seedSource:
                    type: string
                type: object
              deploy:
                description: EnvironmentDeploy defines the deployment configuration
                properties:
                  baselineRef:
                    type: string
                  changedServices:
                    items:
                      type: string
                    type: array
                  manifests:
                    description: |-
                      Manifests specifies where pre-rendered manifests are stored.
                      Required when using the direct deployer.
                    properties:
                      type:
                        description: 'Type is the manifest source type: "configmap"
                          or "url".'
                        enum:
                        - configmap
                        - url
                        type: string
                      url:
                        description: URL for HTTP-based manifest fetching (when type=url).
                        type: string
                    required:
                    - type
                    type: object
                  mode:
                    enum:
                    - delta
                    - full
                    type: string
                  namespace:
                    default: same
                    enum:
                    - same
                    - create
                    type: string
                  namespaceLabels:
                    additionalProperties:
                      type: string
                    type: object
                type: object
              lifecycle:
                description: EnvironmentLifecycle defines the lifecycle configuration
                properties:
                  cleanupOnMerge:
                    type: boolean
                  ttl:
                    type: string
                type: object
              routing:
                description: EnvironmentRouting defines the routing configuration
                properties:
                  asyncRoutes:
                    description: AsyncRoutes defines async routing targets for event-driven
                      backends.
                    items:
                      description: AsyncRouteSpec defines an async routing target
                        for event-driven services.
                      properties:
                        envVarMapping:
                          additionalProperties:
                            type: string
                          description: |-
                            EnvVarMapping maps provisioned targets to environment variable names.
                            If empty, sensible defaults are used based on protocol:
                            - temporal: TEMPORAL_TASK_QUEUE
                            - kafka: KAFKA_CONSUMER_GROUP
                          type: object
                        protocol:
                          description: Protocol is the async protocol type.
                          enum:
                          - temporal
                          - kafka
                          type: string
                        target:
                          description: Target is the baseline resource name (e.g.,
                            task queue name or topic name).
                          type: string
                      required:
                      - protocol
                      - target
                      type: object
                    type: array
                  banner:
                    description: Banner configures a preview indicator banner to inject
                      into responses.
                    properties:
                      color:
                        default: '#FF6B00'
                        type: string
                      enabled:
                        type: boolean
                      position:
                        default: top
                        enum:
                        - top
                        - bottom
                        type: string
                      text:
                        default: Preview Environment
                        type: string
                    type: object
                  baseDomain:
                    description: |-
                      BaseDomain is the base domain for subdomain routing (e.g., "preview.app.dev").
                      When mode is "subdomain", HTTPRoutes are created with hostname "<env-name>.<baseDomain>".
                    type: string
                  cookie:
                    description: Cookie enables sticky routing using cookies.
                    properties:
                      enabled:
                        type: boolean
                      maxAge:
                        minimum: 0
                        type: integer
                      sameSite:
                        enum:
                        - Lax
                        - Strict
                        - None
                        type: string
                      secure:
                        type: boolean
                    type: object
                  devIP:
                    type: string
                  externalUrl:
                    type: string
                  headerKey:
                    type: string
                  headerValue:
                    type: string
                  mode:
                    enum:
                    - header
                    - namespace
                    - subdomain
                    type: string
                  provider:
                    default: gateway
                    enum:
                    - istio
                    - gateway
                    type: string
                type: object
              serviceConfig:
                description: |-
                  ServiceConfig holds preview configuration for multi-repo mode.
                  When set, the controller deploys a single preview pod based on
                  this config rather than using ManifestFetcher.
                properties:
                  databaseEnvKey:
                    description: |-
                      DatabaseEnvKey is the environment variable name for the database connection URL.
                      Defaults to DATABASE_URL.
                    type: string
                  endpoint:
                    description: Endpoint is the external endpoint for mode=local
                      (e.g. Tailscale IP:port).
                    type: string
                  env:
                    description: Env is additional environment variables for the preview
                      container.
                    items:
                      description: EnvVar represents an environment variable for a
                        preview container.
                      properties:
                        name:
                          type: string
                        value:
                          type: string
                      required:
                      - name
                      - value
                      type: object
                    type: array
                  headerKey:
                    description: HeaderKey overrides the routing header key.
                    type: string
                  image:
                    description: Image is the container image for the preview pod
                      (set by CI).
                    type: string
                  imagePullPolicy:
                    description: |-
                      ImagePullPolicy overrides the container image pull policy.
                      Valid values: Always, Never, IfNotPresent. Defaults to IfNotPresent.
                    type: string
                  namespace:
                    description: Namespace is the namespace where the baseline service
                      runs.
                    type: string
                  parentRef:
                    description: |-
                      ParentRef is the Gateway API parentRef name (e.g., Istio Waypoint proxy).
                      If empty, defaults to "diverge-gateway".
                    type: string
                  pathPrefix:
                    description: PathPrefix scopes HTTPRoute matching to a specific
                      path prefix (e.g., "/api/payments") to avoid shadowing the baseline.
                    pattern: ^/.*$
                    type: string
                  port:
                    description: Port is the container port the service listens on.
                    format: int32
                    type: integer
                  protocol:
                    default: http
                    description: |-
                      Protocol specifies the service protocol for routing (http or grpc).
                      When set to "grpc", the router generates a GRPCRoute instead of HTTPRoute.
                    enum:
                    - http
                    - grpc
                    type: string
                  resources:
                    description: Resources overrides the resource requests/limits
                      for the preview pod.
                    properties:
                      cpuLimit:
                        description: CPULimit is the CPU limit for the preview pod.
                        type: string
                      cpuRequest:
                        description: CPURequest is the CPU request for the preview
                          pod (e.g. "100m").
                        type: string
                      memoryLimit:
                        description: MemoryLimit is the memory limit for the preview
                          pod.
                        type: string
                      memoryRequest:
                        description: MemoryRequest is the memory request for the preview
                          pod (e.g. "256Mi").
                        type: string
                    type: object
                  serviceName:
                    description: ServiceName is the Kubernetes Service name to shadow.
                    type: string
                required:
                - image
                - port
                - serviceName
                type: object
              source:
                description: EnvironmentSource defines the source code origin for
                  the environment
                properties:
                  branch:
                    type: string
                  commitSHA:
                    type: string
                  mr:
                    type: integer
                  project:
                    type: string
                  provider:
                    enum:
                    - gitlab
                    - github
                    type: string
                required:
                - branch
                - project
                - provider
                type: object
              testing:
                description: Testing configures automated test integration.
                properties:
                  enabled:
                    description: Enabled controls whether tests are triggered for
                      this environment.
                    type: boolean
                  required:
                    description: Required controls whether test results block the
                      diverge/tests commit status.
                    type: boolean
                  timeout:
                    description: Timeout is how long to wait for test results before
                      timing out.
                    type: string
                  trigger:
                    description: Trigger defines how tests are triggered.
                    properties:
                      eventType:
                        description: |-
                          EventType is the GitHub repository dispatch event type.
                          Used by github-dispatch trigger only.
                        type: string
                      project:
                        description: |-
                          Project is the CI project to trigger (e.g., "team/e2e-tests").
                          Used by gitlab-pipeline and github-dispatch triggers.
                        type: string
                      ref:
                        description: Ref is the git ref to trigger tests against (e.g.,
                          "main").
                        type: string
                      secretRef:
                        description: SecretRef references a Kubernetes Secret containing
                          the trigger token.
                        type: string
                      type:
                        description: TestTriggerType defines how tests are triggered.
                        enum:
                        - gitlab-pipeline
                        - github-dispatch
                        - webhook
                        type: string
                      webhookURL:
                        description: WebhookURL is the URL to POST to for webhook
                          triggers.
                        type: string
                    required:
                    - type
                    type: object
                required:
                - trigger
                type: object
            type: object
          status:
            description: EnvironmentStatus defines the observed state of Environment
            properties:
              commentID:
                type: integer
              commitSHA:
                type: string
              commitStatusURL:
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              createdAt:
                format: date-time
                type: string
              databaseStatus:
                type: string
              expiresAt:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: EnvironmentPhase defines the phases an Environment can
                  be in
                type: string
              services:
                items:
                  type: string
                type: array
              testStatus:
                description: TestStatus tracks the state of the test run for this
                  environment.
                properties:
                  completedAt:
                    format: date-time
                    type: string
                  runID:
                    type: string
                  startedAt:
                    format: date-time
                    type: string
                  state:
                    description: TestState represents the current state of a test
                      run.
                    type: string
                  summary:
                    type: string
                  url:
                    type: string
                type: object
              url:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
