---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: previewgroups.diverge.io
spec:
  group: diverge.io
  names:
    kind: PreviewGroup
    listKind: PreviewGroupList
    plural: previewgroups
    singular: previewgroup
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - description: Aggregated phase of the preview group
      jsonPath: .status.phase
      name: Phase
      type: string
    - description: Number of services
      jsonPath: .status.serviceCount
      name: Services
      type: integer
    - description: Routing header value
      jsonPath: .spec.routing.headerValue
      name: Header
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PreviewGroup is a collection of related preview services deployed together
          from a single MR/PR. It acts as an "operator of operators", creating and
          managing child Environment CRs across multiple namespaces.

          PreviewGroup is cluster-scoped because services in a preview group may span
          multiple namespaces (e.g. product-rad, product-clinical, platform-core).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PreviewGroupSpec defines the desired state of a PreviewGroup.
            properties:
              database:
                description: |-
                  Database provides group-level database configuration.
                  Individual services can override this in their own database field.
                properties:
                  atlas:
                    description: AtlasSpec configures Atlas Operator integration for
                      database schema management.
                    properties:
                      blocking:
                        default: true
                        description: Blocking controls whether the Environment waits
                          for Atlas to report Ready.
                        type: boolean
                      migrationConfigMap:
                        description: MigrationConfigMap references a ConfigMap containing
                          versioned .sql migration files and atlas.sum.
                        type: string
                      mode:
                        description: Mode selects the Atlas migration paradigm.
                        enum:
                        - versioned
                        - declarative
                        type: string
                      policy:
                        description: Policy configures Atlas safety policies.
                        properties:
                          destructive:
                            default: error
                            description: Destructive controls how destructive schema
                              changes are handled.
                            enum:
                            - error
                            - warn
                            - allow
                            type: string
                        type: object
                      schemaConfigMap:
                        description: SchemaConfigMap references a ConfigMap containing
                          the desired schema (SQL or HCL).
                        type: string
                    type: object
                  connectionRef:
                    type: string
                  migrationJob:
                    description: MigrationJobSpec configures a Kubernetes Job for
                      database migrations.
                    properties:
                      args:
                        description: Args specifies the arguments to pass to the migration
                          job container.
                        items:
                          type: string
                        type: array
                      blocking:
                        default: true
                        description: Blocking controls whether the Environment waits
                          for the migration to complete.
                        type: boolean
                      envFrom:
                        description: EnvFrom specifies environment variables to inject
                          from Secrets.
                        items:
                          description: SecretRef references a specific key within
                            a Kubernetes Secret.
                          properties:
                            key:
                              description: Key is the specific key in the Secret to
                                reference.
                              type: string
                            name:
                              description: Name is the name of the Secret.
                              type: string
                            namespace:
                              description: Namespace is the namespace of the Secret.
                              type: string
                          type: object
                        type: array
                      image:
                        description: Image is the container image to use for the migration
                          job.
                        type: string
                      timeoutSeconds:
                        description: TimeoutSeconds is the maximum duration the migration
                          job can run before being terminated.
                        format: int32
                        type: integer
                    type: object
                  mode:
                    enum:
                    - shared
                    - schema
                    - snapshot
                    - fresh
                    type: string
                  seedSource:
                    type: string
                type: object
              lifecycle:
                description: Lifecycle configures TTL and automatic cleanup.
                properties:
                  cleanupOnMerge:
                    description: |-
                      CleanupOnMerge controls whether to automatically delete the preview group
                      when the source MR/PR is merged or closed.
                    type: boolean
                  ttl:
                    description: |-
                      TTL is the time-to-live for the preview group.
                      After this duration, the group is automatically deleted.
                    type: string
                type: object
              owner:
                description: |-
                  Owner is the username of the developer who created this PreviewGroup.
                  Used for collision detection and audit.
                type: string
              routing:
                description: Routing configures header-based traffic routing shared
                  by all services.
                properties:
                  baseDomain:
                    description: BaseDomain is the base domain for subdomain routing.
                    type: string
                  externalUrl:
                    description: |-
                      ExternalURL is an optional shareable URL for non-engineer access
                      (e.g. "https://mr-42.preview.dev.azra-ai.com").
                    type: string
                  headerKey:
                    default: x-preview-env
                    description: |-
                      HeaderKey is the HTTP header key used for routing.
                      Defaults to "x-preview-env".
                    type: string
                  headerValue:
                    description: |-
                      HeaderValue is the value that identifies this preview group.
                      Typically set to the MR number (e.g. "42") or branch name.
                    minLength: 1
                    type: string
                  mode:
                    default: header
                    description: Mode is the routing mode.
                    enum:
                    - header
                    - subdomain
                    type: string
                required:
                - headerValue
                type: object
              services:
                description: Services defines the services included in this preview
                  group.
                items:
                  description: |-
                    PreviewGroupServiceSpec defines a single service in a preview group.
                    Only Name is required; Port, ParentRef, and PathPrefix
                    are auto-discovered from existing Kubernetes Services if omitted.
                  properties:
                    asyncRoutes:
                      description: AsyncRoutes defines async routing targets to provision
                        for this service.
                      items:
                        description: AsyncRouteSpec defines an async routing target
                          for event-driven services.
                        properties:
                          envVarMapping:
                            additionalProperties:
                              type: string
                            description: |-
                              EnvVarMapping maps provisioned targets to environment variable names.
                              If empty, sensible defaults are used based on protocol:
                              - temporal: TEMPORAL_TASK_QUEUE
                              - kafka: KAFKA_CONSUMER_GROUP
                            type: object
                          protocol:
                            description: Protocol is the async protocol type.
                            enum:
                            - temporal
                            - kafka
                            type: string
                          target:
                            description: Target is the baseline resource name (e.g.,
                              task queue name or topic name).
                            type: string
                        required:
                        - protocol
                        - target
                        type: object
                      type: array
                    database:
                      description: Database overrides the group-level database configuration
                        for this service.
                      properties:
                        atlas:
                          description: AtlasSpec configures Atlas Operator integration
                            for database schema management.
                          properties:
                            blocking:
                              default: true
                              description: Blocking controls whether the Environment
                                waits for Atlas to report Ready.
                              type: boolean
                            migrationConfigMap:
                              description: MigrationConfigMap references a ConfigMap
                                containing versioned .sql migration files and atlas.sum.
                              type: string
                            mode:
                              description: Mode selects the Atlas migration paradigm.
                              enum:
                              - versioned
                              - declarative
                              type: string
                            policy:
                              description: Policy configures Atlas safety policies.
                              properties:
                                destructive:
                                  default: error
                                  description: Destructive controls how destructive
                                    schema changes are handled.
                                  enum:
                                  - error
                                  - warn
                                  - allow
                                  type: string
                              type: object
                            schemaConfigMap:
                              description: SchemaConfigMap references a ConfigMap
                                containing the desired schema (SQL or HCL).
                              type: string
                          type: object
                        connectionRef:
                          type: string
                        migrationJob:
                          description: MigrationJobSpec configures a Kubernetes Job
                            for database migrations.
                          properties:
                            args:
                              description: Args specifies the arguments to pass to
                                the migration job container.
                              items:
                                type: string
                              type: array
                            blocking:
                              default: true
                              description: Blocking controls whether the Environment
                                waits for the migration to complete.
                              type: boolean
                            envFrom:
                              description: EnvFrom specifies environment variables
                                to inject from Secrets.
                              items:
                                description: SecretRef references a specific key within
                                  a Kubernetes Secret.
                                properties:
                                  key:
                                    description: Key is the specific key in the Secret
                                      to reference.
                                    type: string
                                  name:
                                    description: Name is the name of the Secret.
                                    type: string
                                  namespace:
                                    description: Namespace is the namespace of the
                                      Secret.
                                    type: string
                                type: object
                              type: array
                            image:
                              description: Image is the container image to use for
                                the migration job.
                              type: string
                            timeoutSeconds:
                              description: TimeoutSeconds is the maximum duration
                                the migration job can run before being terminated.
                              format: int32
                              type: integer
                          type: object
                        mode:
                          enum:
                          - shared
                          - schema
                          - snapshot
                          - fresh
                          type: string
                        seedSource:
                          type: string
                      type: object
                    endpoint:
                      description: |-
                        Endpoint is the external endpoint for mode=local
                        (e.g. "100.64.23.42:8080" for a developer's Tailscale IP).
                        Required when mode is "local", ignored otherwise.
                      type: string
                    env:
                      description: Env specifies additional environment variables
                        for the preview pod.
                      items:
                        description: EnvVar represents an environment variable for
                          a preview container.
                        properties:
                          name:
                            type: string
                          value:
                            type: string
                        required:
                        - name
                        - value
                        type: object
                      type: array
                    image:
                      description: |-
                        Image is the container image to deploy for mode=image.
                        Required when mode is "image", ignored for "local" and "baseline".
                      type: string
                    imagePullPolicy:
                      description: ImagePullPolicy overrides the container image pull
                        policy.
                      enum:
                      - Always
                      - Never
                      - IfNotPresent
                      type: string
                    keda:
                      description: |-
                        KEDA configures per-service autoscaling and scale-to-zero settings.
                        Overrides controller-level CLI flags when set.
                      properties:
                        cooldownPeriod:
                          description: |-
                            CooldownPeriod is the cooldown period in seconds before scaling down.
                            When nil, falls back to the controller CLI flag (--keda-cooldown).
                          format: int32
                          minimum: 0
                          type: integer
                        enabled:
                          description: Enabled enables KEDA autoscaling for this service.
                          type: boolean
                        maxReplicas:
                          description: |-
                            MaxReplicas is the maximum number of replicas.
                            When nil, falls back to the controller CLI flag (--keda-max-replicas).
                          format: int32
                          maximum: 100
                          minimum: 1
                          type: integer
                        minReplicas:
                          description: |-
                            MinReplicas is the minimum number of replicas. Set to 0 for scale-to-zero.
                            When nil, falls back to the controller CLI flag (--keda-min-replicas).
                          format: int32
                          minimum: 0
                          type: integer
                        pollingInterval:
                          description: 'PollingInterval is the interval in seconds
                            KEDA checks metrics. Default: 30.'
                          format: int32
                          minimum: 1
                          type: integer
                        targetQueueSize:
                          description: 'TargetQueueSize is the target backlog per
                            replica for queue-based scaling. Default: 5.'
                          format: int32
                          type: integer
                      type: object
                    mode:
                      default: image
                      description: Mode defines how this service participates in the
                        preview group.
                      enum:
                      - image
                      - local
                      - baseline
                      type: string
                    name:
                      description: Name of the Kubernetes Service to preview. Must
                        match an existing Service.
                      minLength: 1
                      type: string
                    namespace:
                      description: Namespace is the Kubernetes namespace where the
                        service will be deployed. Required. If omitted, falls back
                        to the controller's default namespace.
                      type: string
                    parentRef:
                      description: |-
                        ParentRef is the Gateway API parentRef name (e.g. the Istio waypoint proxy
                        or a gateway). Auto-discovered if empty.
                      type: string
                    pathPrefix:
                      description: |-
                        PathPrefix scopes HTTPRoute matching to a specific path prefix
                        (e.g. "/api/payments") to avoid shadowing the baseline service.
                        Auto-discovered if empty.
                      pattern: ^/.*$
                      type: string
                    port:
                      description: Port is the container port. Auto-discovered from
                        existing Service if 0.
                      format: int32
                      type: integer
                    postDeploy:
                      description: PostDeploy configures a generic post-deployment
                        Job hook for this service.
                      properties:
                        args:
                          description: Args specifies the arguments to pass to the
                            post-deploy container.
                          items:
                            type: string
                          type: array
                        blocking:
                          default: false
                          description: Blocking controls whether the Environment waits
                            for the post-deploy job.
                          type: boolean
                        envFrom:
                          description: EnvFrom specifies environment variables to
                            inject from Secrets.
                          items:
                            description: SecretRef references a specific key within
                              a Kubernetes Secret.
                            properties:
                              key:
                                description: Key is the specific key in the Secret
                                  to reference.
                                type: string
                              name:
                                description: Name is the name of the Secret.
                                type: string
                              namespace:
                                description: Namespace is the namespace of the Secret.
                                type: string
                            type: object
                          type: array
                        image:
                          description: Image is the container image to use for the
                            post-deploy job.
                          type: string
                        timeoutSeconds:
                          description: TimeoutSeconds is the maximum duration before
                            the job is terminated.
                          format: int32
                          type: integer
                      type: object
                    protocol:
                      default: http
                      description: Protocol determines whether to generate an HTTPRoute
                        or GRPCRoute.
                      enum:
                      - http
                      - grpc
                      type: string
                    resources:
                      description: |-
                        Resources overrides the baseline resource requests/limits for preview pods.
                        If unset, the controller defaults to conservative values (100m CPU, 256Mi RAM).
                      properties:
                        cpuLimit:
                          description: CPULimit is the CPU limit for the preview pod.
                          type: string
                        cpuRequest:
                          description: CPURequest is the CPU request for the preview
                            pod (e.g. "100m").
                          type: string
                        memoryLimit:
                          description: MemoryLimit is the memory limit for the preview
                            pod.
                          type: string
                        memoryRequest:
                          description: MemoryRequest is the memory request for the
                            preview pod (e.g. "256Mi").
                          type: string
                      type: object
                  required:
                  - name
                  type: object
                minItems: 1
                type: array
              source:
                description: Source identifies the SCM context (GitLab MR, GitHub
                  PR, etc.)
                properties:
                  branch:
                    type: string
                  commitSHA:
                    type: string
                  mr:
                    type: integer
                  project:
                    type: string
                  provider:
                    enum:
                    - gitlab
                    - github
                    type: string
                required:
                - branch
                - project
                - provider
                type: object
            required:
            - routing
            - services
            - source
            type: object
          status:
            description: PreviewGroupStatus describes the observed state of a PreviewGroup.
            properties:
              commentID:
                description: CommentID is the ID of the comment tracking the preview
                  group status.
                format: int64
                type: integer
              conditions:
                description: |-
                  Conditions represent the latest available observations of the
                  PreviewGroup's state. Includes "Ready" and "Degraded" conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              createdAt:
                description: CreatedAt is when the preview group was first created.
                format: date-time
                type: string
              expiresAt:
                description: ExpiresAt is when the preview group will expire (from
                  TTL).
                format: date-time
                type: string
              leaseRenewedAt:
                description: LeaseRenewedAt is the last time the owning CLI heartbeat
                  renewed the lease.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the last observed generation of
                  the spec.
                format: int64
                type: integer
              phase:
                description: Phase is the aggregated phase across all services.
                enum:
                - Pending
                - Deploying
                - Running
                - Degraded
                - Failed
                - Terminating
                type: string
              serviceCount:
                description: ServiceCount is the total number of services in the group.
                format: int32
                type: integer
              services:
                description: Services contains per-service status.
                items:
                  description: |-
                    PreviewGroupServiceStatus reports the current state of a single service
                    within a PreviewGroup.
                  properties:
                    changedServices:
                      description: |-
                        ChangedServices lists the services that were modified in this preview,
                        sourced from the child Environment's spec.deploy.changedServices.
                      items:
                        type: string
                      type: array
                    environmentName:
                      description: EnvironmentName is the name of the child Environment
                        CR created for this service.
                      type: string
                    lastLogSnippet:
                      description: |-
                        LastLogSnippet contains the last few lines from the preview pod's
                        container logs, enabling quick debugging from the MR comment.
                      type: string
                    message:
                      description: Message is a human-readable status message.
                      type: string
                    name:
                      description: Name is the service name.
                      type: string
                    namespace:
                      description: Namespace is where the preview pod is deployed.
                      type: string
                    phase:
                      description: Phase is the current lifecycle phase of this service's
                        preview.
                      type: string
                    reason:
                      description: |-
                        Reason is a machine-readable failure reason
                        (e.g. "CrashLoopBackOff", "ImagePullBackOff", "OOMKilled").
                      type: string
                    url:
                      description: URL is the reachable URL for this service's preview.
                      type: string
                  required:
                  - name
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
