apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-migrations
  namespace: default
  labels:
    app.kubernetes.io/part-of: diverge-fullstack-demo
data:
  20260901000000_initial_orders.sql: |
    -- Baseline orders table for checkout-api
    CREATE TABLE IF NOT EXISTS orders (
      id UUID PRIMARY KEY,
      amount_cents INT NOT NULL,
      currency TEXT NOT NULL DEFAULT 'USD',
      created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
  20260902000000_add_instant_payouts.sql: |
    -- PR #42 migration: add instant payouts column to orders
    ALTER TABLE orders ADD COLUMN IF NOT EXISTS payout_speed TEXT NOT NULL DEFAULT 'standard';
  atlas.sum: |
    h1:XUtLdS8zm+t6HVrMfwVQbPamIBiTa/448oVgmkjTdoA=
    20260901000000_initial_orders.sql h1:mL2BNRpR5Fr/lokyKluOlIPNKykrbeGr/X7oxGUmXEU=
    20260902000000_add_instant_payouts.sql h1:GWuFouPNBfB52dC5w3b3EX7T8ebIpCJWsaNOOBV+zm4=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-web
  namespace: default
  labels:
    app: storefront-web
    app.kubernetes.io/part-of: diverge-fullstack-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storefront-web
  template:
    metadata:
      labels:
        app: storefront-web
    spec:
      containers:
        - name: storefront-web
          image: ghcr.io/divergedev/demo-storefront-web:baseline
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: DIVERGE_ENV
              value: "baseline"
            - name: CHECKOUT_API_URL
              value: "http://checkout-api.default.svc.cluster.local:8081"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: storefront-web
  namespace: default
  labels:
    app: storefront-web
    app.kubernetes.io/part-of: diverge-fullstack-demo
spec:
  selector:
    app: storefront-web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: default
  labels:
    app: checkout-api
    app.kubernetes.io/part-of: diverge-fullstack-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
    spec:
      containers:
        - name: checkout-api
          image: ghcr.io/divergedev/demo-checkout-api:baseline
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: PORT
              value: "8081"
            - name: DIVERGE_ENV
              value: "baseline"
            - name: DIVERGE_PREVIEW_SCHEMA
              value: "public"
            - name: ORDERS_QUEUE_TOPIC
              value: "orders-events"
            - name: FEATURE_INSTANT_PAYOUTS
              value: "false"
            - name: FEATURE_CHECKOUT_V2_BANNER
              value: "false"
            - name: FULFILLMENT_WORKER_URL
              value: "http://fulfillment-worker.default.svc.cluster.local:8082"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  namespace: default
  labels:
    app: checkout-api
    app.kubernetes.io/part-of: diverge-fullstack-demo
spec:
  selector:
    app: checkout-api
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fulfillment-worker
  namespace: default
  labels:
    app: fulfillment-worker
    app.kubernetes.io/part-of: diverge-fullstack-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fulfillment-worker
  template:
    metadata:
      labels:
        app: fulfillment-worker
    spec:
      containers:
        - name: fulfillment-worker
          image: ghcr.io/divergedev/demo-fulfillment-worker:baseline
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: PORT
              value: "8082"
            - name: DIVERGE_ENV
              value: "baseline"
            - name: ORDERS_QUEUE_TOPIC
              value: "orders-events"
            - name: CONSUMER_GROUP_ID
              value: "orders-cg-baseline"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fulfillment-worker
  namespace: default
  labels:
    app: fulfillment-worker
    app.kubernetes.io/part-of: diverge-fullstack-demo
spec:
  selector:
    app: fulfillment-worker
  ports:
    - name: http
      port: 8082
      targetPort: 8082
